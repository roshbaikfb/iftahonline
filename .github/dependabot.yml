version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      opentelemetry: { patterns: ["go.opentelemetry.io/*"] }
      testcontainers: { patterns: ["github.com/testcontainers/*"] }
      river: { patterns: ["github.com/riverqueue/*"] } # River upgrades need a new goose migration (ADR-0003)
  - package-ecosystem: npm
    directory: /web/dashboard
    schedule: { interval: weekly }
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # These majors require Node >= 22; local development still runs Node 20.19.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/jest-dom"
        update-types: ["version-update:semver-major"]
      # Types must match the Node version we target (22 LTS in CI).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: { interval: weekly }
