# sqlc: SQL-first, type-safe queries (CLAUDE.md stack). No ORM.
# `make gen` runs `sqlc generate` offline; `make ci` runs `sqlc vet`
# against a migrated database (SQLC_VET_DATABASE_URL) so every query is
# prepared by real PostgreSQL.
version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/platform
    database:
      uri: ${SQLC_VET_DATABASE_URL}
    analyzer:
      database: false
    rules:
      - sqlc/db-prepare
      - no-unbounded-delete
    gen:
      go:
        package: dbgen
        out: internal/server/dbgen
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/tenancy
    database:
      uri: ${SQLC_VET_DATABASE_URL}
    analyzer:
      database: false
    rules:
      - sqlc/db-prepare
      - no-unbounded-delete
    gen:
      go:
        package: tenancydb
        out: internal/modules/tenancy/internal/store/tenancydb
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/roshbaikfb/iftahonline/internal/platform/ulid.ID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/roshbaikfb/iftahonline/internal/platform/ulid
              type: ID
              pointer: true
          - db_type: citext
            go_type: string
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/identity
    database:
      uri: ${SQLC_VET_DATABASE_URL}
    analyzer:
      database: false
    rules:
      - sqlc/db-prepare
      - no-unbounded-delete
    gen:
      go:
        package: identitydb
        out: internal/modules/identity/internal/store/identitydb
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/roshbaikfb/iftahonline/internal/platform/ulid.ID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/roshbaikfb/iftahonline/internal/platform/ulid
              type: ID
              pointer: true
          - db_type: citext
            go_type: string
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/admin
    database:
      uri: ${SQLC_VET_DATABASE_URL}
    analyzer:
      database: false
    rules:
      - sqlc/db-prepare
      - no-unbounded-delete
    gen:
      go:
        package: admindb
        out: internal/modules/admin/internal/store/admindb
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/roshbaikfb/iftahonline/internal/platform/ulid.ID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/roshbaikfb/iftahonline/internal/platform/ulid
              type: ID
              pointer: true
          - db_type: citext
            go_type: string

  - engine: postgresql
    schema: db/migrations
    queries: db/queries/catalog
    database:
      uri: ${SQLC_VET_DATABASE_URL}
    analyzer:
      database: false
    rules:
      - sqlc/db-prepare
      - no-unbounded-delete
    gen:
      go:
        package: catalogdb
        out: internal/modules/catalog/internal/store/catalogdb
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/roshbaikfb/iftahonline/internal/platform/ulid.ID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/roshbaikfb/iftahonline/internal/platform/ulid
              type: ID
              pointer: true
          - db_type: citext
            go_type: string
          - db_type: citext
            nullable: true
            go_type:
              type: string
              pointer: true

# sqlc expands SELECT * into explicit columns at generate time, so a
# "no select star" rule could never fire; it is intentionally absent.
rules:
  - name: no-unbounded-delete
    message: "DELETE and UPDATE need a WHERE clause"
    rule: query.sql.matches("(?is)^\\s*(delete\\s+from|update)\\s+[a-z_.]+(\\s+set\\s+[^;]*?)?\\s*;?\\s*$") && !query.sql.matches("(?i)\\swhere\\s")
