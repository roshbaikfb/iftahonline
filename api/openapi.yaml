        free_over_minor: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        cod_fee: { $ref: "#/components/schemas/CODFee" }
        eta_min_days: { type: integer, minimum: 0, maximum: 30, description: "Fewest days delivery takes (0: the same day). Set with eta_max_days, or neither." }
