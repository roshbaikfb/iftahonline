openapi: 3.0.3
info:
  title: iftahonline platform API
  version: 1.0.0
  description: |
    Contract for the merchant dashboard, the mobile app and integrations.
    Change this file first, regenerate (`make gen`), then implement
    (CLAUDE.md rule 11). Breaking changes inside /v1 fail CI (oasdiff).

    Errors use RFC 9457 `application/problem+json`.
servers:
  - url: /
# Every operation needs a session unless it declares `security: []`.
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: system
    description: Process health and build metadata.
  - name: identity
    description: |
      Accounts, sign-up, sessions and the store audit log (ADR-0005). The
      dashboard authenticates with the `__Host-sid` cookie set by sign-up
      and login; the mobile app sends `"client": "mobile"` and uses the
      returned token as a bearer token.
  - name: admin
    description: |
      The super-admin console (ADR-0005 §8). Served only on the admin
      host (ADMIN_HOST, e.g. admin.iftahonline.com); every other host
      gets 404. Admins are separate from merchant users, sign in with
      password and TOTP together, and every action is recorded in the
      append-only admin audit log.
  - name: tenancy
    description: |
      The store and its domains. Every path is scoped to one store; a
      caller who is not a member of that store gets 404 (ADR-0006).
  - name: catalog
    description: |
      Products, variants, stock and categories (ADR-0011). Every path is
      scoped to one store; a caller who is not a member of that store, or
      who names another store's product, variant or category, gets 404.
      Prices are integer minor units in the store's currency.
  - name: storefront
    description: |
      The store's look and pages (ADR-0016): theme settings, the home
      page, landing pages and policies. Pages are ordered sections whose
      settings follow each section type's JSON schema
      (listSectionTypes); merchants never supply HTML or scripts.
      Every save sends the `version` it read (0 to create) and fails with
      409 version_conflict if someone saved in between.
      Permission: storefront.manage for every operation.
  - name: customers
    description: |
      A store's customers (ADR-0020): one per phone number, created by
      their first order. Merchants look them up by phone or name and keep
      a block list; a blocked phone cannot order (the shopper sees only a
      generic refusal). Phones are E.164 (+201012345678); numbers typed
      without a country code are read in the store's country.
  - name: orders
    description: |
      Orders (ADR-0021). An order moves through an explicit state
      machine: pending → confirmed → ready_to_ship → shipped →
      delivered, plus cancelled (before shipping), failed_delivery
      (retried or returned) and returned. Forbidden moves are 409
      invalid_transition. Confirming and cancelling need orders.manage;
      packing, shipping, deliveries and returns need orders.fulfil.
      Stock is held when an order is placed, leaves on_hand when it
      ships, and comes back when it is cancelled or returned. Amounts
      are integer minor units in the store's currency; times are UTC.
  - name: shipping
    description: |
      Delivery zones, rates and fees (ADR-0025). A zone is a set of
      governorates (ISO 3166-2 codes of the store's country, each in one
      zone only) with a flat rate; cities in it may have their own rate
      (matched however the shopper spells them, e.g. المعادي/المعادى).
      Orders whose subtotal reaches the free-shipping threshold (the
      zone's, else the store's) ship free. The cash-on-delivery fee (the
      zone's, else the store's) is a fixed amount plus basis points of
      the subtotal and shipping, kept between a minimum and a maximum.
      A store without zones delivers everywhere with free shipping;
      once it has zones, governorates outside them are not delivered.
      Amounts are integer minor units of the store's currency. Reading
      needs shipping.read, changing needs shipping.manage; saves send the
      `version` read and fail with 409 version_conflict if someone saved
      in between.
  - name: payments
    description: |
      Card payments through the store's own gateway account (ADR-0029).
      Card data never reaches the platform: shoppers pay on the gateway's
      hosted page. A payment changes only on the gateway's word, asked
      again after every webhook; a paid payment marks its order paid and
      confirms it, and a card order unpaid an hour after it was placed is
      cancelled. Refunds, partial or full, are asked from the gateway in
      the background. Connecting a gateway needs payments.manage (the
      owner), refunding payments.refund, reading orders.read. Amounts are
      integer minor units of the payment's currency.
  - name: checkout
    description: |
      The shopper's card payment, through the platform's API host
      (ADR-0030): the storefront never holds a merchant's gateway keys,
      so it sends the shopper here after placing a card order. These are
      browser redirects (303), not JSON operations; errors are problem
      pages. The return URL must be on a host of the same store.
  - name: webhooks
    description: |
      Inbound webhooks from carriers and payment gateways (ADR-0024).
      Each store connection has its own URL, which the merchant (or the
      platform, through the provider's API) registers with the provider.
      A delivery is accepted only when its signature verifies against
      that connection; a forged one is 401 and logged. Accepted
      deliveries are stored as received and processed once per provider
      event id (a replay is 200 `duplicate`); processing re-queries the
      provider before any order or payment changes. Rate-limited per
      client IP and per connection.

      An account the platform owns and shares between stores (one
      WhatsApp number, ADR-0038) has a single URL without a store: the
      provider verifies a delivery with the platform's secret and splits
      it into the events of each store, and each event is then accepted
      in its own store exactly as above. Providers that prove ownership
      of a URL with a GET handshake (Meta's `hub.challenge`) get it on
      both routes.
  - name: onboarding
    description: |
      The new store's setup wizard (ADR-0034). Signing up opens it; the
      merchant picks an activity, a look and a colour, and a starter
      template (theme, home page, categories, sample products, shipping
      zones, draft policies) is applied in the background. Stores made
      before the wizard have no wizard (`completed`). Permission:
      store.read to read, store.update to change.
paths:
  /livez:
    get:
      tags: [system]
      operationId: getLivez
      summary: Liveness probe
      description: 200 while the process is running. Never checks dependencies.
      security: []
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      tags: [system]
      operationId: getReadyz
      summary: Readiness probe
      description: |
        200 when every dependency answers; 503 when one fails or the process
        is draining before shutdown.
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Not ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /v1/meta/version:
    get:
      tags: [system]
      operationId: getVersion
      summary: Build information
      security: []
      responses:
        "200":
          description: Build information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/signup:
    post:
      tags: [identity]
      operationId: signup
      summary: Create an account and its first store
      description: |
        Creates the user, the store with its `<slug>.iftahonline.com`
        subdomain, the owner membership and a session, atomically.
        Rate-limited per IP. Store field errors are reported as
        `store.<field>`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201":
          description: Signed up and signed in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/login:
    post:
      tags: [identity]
      operationId: login
      summary: Sign in with email and password
      description: |
        Wrong email, wrong password and disabled accounts get the same 401.
        Repeated failures for one email are refused with 429 until the
        budget refills; attempts are also limited per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "202":
          description: Password accepted; complete sign-in with `POST /v1/auth/mfa`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFARequired" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/mfa:
    post:
      tags: [identity]
      operationId: verifyMFA
      summary: Complete sign-in with a TOTP or recovery code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MFAVerifyRequest" }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/otp/start:
    post:
      tags: [identity]
      operationId: startOTPLogin
      summary: Send a sign-in code to a verified phone
      description: |
        Always answers 202 with a challenge, whether or not the number has
        an account. Limited per number (1/min, 10/day) and per IP. 503
        while no SMS/WhatsApp provider is configured.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneRequest" }
      responses:
        "202":
          description: A code was sent if the number has an account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeChallenge" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/otp/verify:
    post:
      tags: [identity]
      operationId: verifyOTPLogin
      summary: Sign in with the code from the phone
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeVerifyRequest" }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "202":
          description: Code accepted; complete sign-in with `POST /v1/auth/mfa`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFARequired" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/invitations/accept:
    post:
      tags: [identity]
      operationId: acceptInvitation
      summary: Join a store from an invitation link
      description: |
        If the invited email has an account, the caller must be signed in
        as it. Otherwise `name` and `password` create the account and a
        session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInvitationRequest" }
      responses:
        "200":
          description: Joined.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptInvitationResponse" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/slug-availability:
    get:
      tags: [identity]
      operationId: checkSlugAvailability
      summary: Check whether a store address is free
      description: |
        For the sign-up form, before the account exists. Rate-limited per
        IP. Advisory: sign-up checks again and answers 422 `store.slug`
        `taken` when the address went in between.
      security: []
      parameters:
        - name: slug
          in: query
          required: true
          schema: { type: string, maxLength: 100, example: beit-mona }
      responses:
        "200":
          description: The verdict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlugAvailability" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/logout:
    post:
      tags: [identity]
      operationId: logout
      summary: End the current session
      responses:
        "204":
          description: Signed out; the cookie is cleared.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/me:
    get:
      tags: [identity]
      operationId: getMe
      summary: The signed-in user and their stores
      responses:
        "200":
          description: The user and their memberships.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/phone:
    post:
      tags: [identity]
      operationId: startPhoneVerification
      summary: Send a code to a phone number to add to the account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneRequest" }
      responses:
        "202":
          description: Code sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeChallenge" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/phone/verify:
    post:
      tags: [identity]
      operationId: verifyPhone
      summary: Confirm the phone number with the received code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeVerifyRequest" }
      responses:
        "204":
          description: Phone verified; it can now be used for sign-in.
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/mfa/totp:
    post:
      tags: [identity]
      operationId: setupTOTP
      summary: Start two-factor enrolment
      responses:
        "200":
          description: Seed to add to an authenticator app (show as a QR code).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TOTPSetup" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/mfa/totp/confirm:
    post:
      tags: [identity]
      operationId: confirmTOTP
      summary: Enable two-factor authentication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TOTPCode" }
      responses:
        "200":
          description: Enabled. The recovery codes are shown only now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/mfa/totp/disable:
    post:
      tags: [identity]
      operationId: disableTOTP
      summary: Disable two-factor authentication
      description: Needs the password and a current code (or a recovery code).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisableTOTPRequest" }
      responses:
        "204":
          description: Disabled.
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/sessions:
    get:
      tags: [identity]
      operationId: listMySessions
      summary: The signed-in user's active sessions
      responses:
        "200":
          description: Sessions, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ULID" }
    delete:
      tags: [identity]
      operationId: revokeMySession
      summary: Sign out one device
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/members:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [identity]
      operationId: listMembers
      summary: The store's team
      description: "Permission: members.read."
      responses:
        "200":
          description: Members, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - name: user_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ULID" }
    patch:
      tags: [identity]
      operationId: updateMemberRole
      summary: Change a member's role
      description: "Permission: members.manage. The owner's role cannot be changed."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberRoleUpdate" }
      responses:
        "204":
          description: Changed.
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [identity]
      operationId: removeMember
      summary: Remove a member from the store
      description: "Permission: members.manage. The owner cannot be removed."
      responses:
        "204":
          description: Removed; their next request to this store gets 404.
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/invitations:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [identity]
      operationId: listInvitations
      summary: Open invitations
      description: "Permission: members.manage."
      responses:
        "200":
          description: Open invitations, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationList" }
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [identity]
      operationId: createInvitation
      summary: Invite someone to the team by email
      description: "Permission: members.manage. The link is emailed and valid for 7 days."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewInvitation" }
      responses:
        "201":
          description: Invitation created and queued for email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/invitations/{invitation_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - name: invitation_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ULID" }
    delete:
      tags: [identity]
      operationId: revokeInvitation
      summary: Cancel an open invitation
      description: "Permission: members.manage."
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/audit-log:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [identity]
      operationId: listAuditLog
      summary: The store's audit log
      description: "Permission: audit.read. Newest first; follow `next_cursor`."
      parameters:
        - name: cursor
          in: query
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [tenancy]
      operationId: getStore
      summary: Get the store
      description: "Permission: store.read."
      responses:
        "200":
          description: The store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [tenancy]
      operationId: updateStore
      summary: Update store settings
      description: "Permission: store.update. Currency and plan are not editable here."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreSettings" }
      responses:
        "200":
          description: The updated store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/domains:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [tenancy]
      operationId: listDomains
      summary: List the store's domains
      description: "Permission: domains.read."
      responses:
        "200":
          description: Domains, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainList" }
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [tenancy]
      operationId: addDomain
      summary: Add a custom domain
      description: |
        Permission: domains.manage. The domain starts as `pending`; publish
        the returned TXT record, and it is verified automatically (checked
        with backoff for about three days).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewDomain" }
      responses:
        "201":
          description: The pending domain.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/domains/{domain_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/DomainID"
    delete:
      tags: [tenancy]
      operationId: deleteDomain
      summary: Remove a custom domain
      description: "Permission: domains.manage. The platform subdomain and the primary domain cannot be removed."
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/domains/{domain_id}/verify:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/DomainID"
    post:
      tags: [tenancy]
      operationId: verifyDomain
      summary: Check a pending or failed domain again now
      description: "Permission: domains.manage."
      responses:
        "202":
          description: Verification restarted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/domains/{domain_id}/primary:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/DomainID"
    post:
      tags: [tenancy]
      operationId: setPrimaryDomain
      summary: Make a verified domain the canonical host
      description: "Permission: domains.manage."
      responses:
        "200":
          description: The new primary domain.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/products:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [catalog]
      operationId: listProducts
      summary: List products
      description: |
        Permission: catalog.read. Newest first, with variants, stock and
        category IDs; follow `next_cursor`. Deleted products are never listed.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, active, archived] }
        - name: category_id
          in: query
          schema: { $ref: "#/components/schemas/ULID" }
        - name: stock
          in: query
          description: |
            `in_stock`: a variant can be bought (untracked, or units free);
            `out`: none can; `low`: a tracked variant has 1 to
            `low_threshold` units free.
          schema: { type: string, enum: [in_stock, low, out] }
        - name: low_threshold
          in: query
          description: The `low` bound; the dashboard passes the storefront theme's `low_stock`.
          schema: { type: integer, minimum: 1, maximum: 100, default: 5 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductPage" }
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [catalog]
      operationId: createProduct
      summary: Create a product
      description: |
        Permission: catalog.manage. Without `slug`, one is derived from the
        title (Arabic letters are kept). Variants must not carry `id`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: The product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/products/counts:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [catalog]
      operationId: countProducts
      summary: Count products by status
      description: "Permission: catalog.read. Live products only, for the list's tabs."
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductCounts" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/products/bulk:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    post:
      tags: [catalog]
      operationId: bulkProducts
      summary: Change the status of, or delete, several products
      description: |
        Permission: catalog.manage. `active`, `draft` or `archived` sets the
        status of every listed product; `delete` deletes them as
        deleteProduct does. IDs that are not the store's live products are
        skipped; `updated` counts the others.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductBulk" }
      responses:
        "200":
          description: How many products changed.
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/products/samples:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    delete:
      tags: [catalog]
      operationId: deleteSampleProducts
      summary: Delete the starter template's sample products
      description: |
        Permission: catalog.manage. Deletes every product marked `sample`,
        as deleteProduct deletes one; the merchant's own products are left
        alone. Idempotent: with none left it deletes 0.
      responses:
        "200":
          description: How many were deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/products/search:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [catalog]
      operationId: searchProducts
      summary: Search the store's products
      description: |
        Permission: catalog.read. Full-text search over title, options,
        SKUs and description, typo tolerant, with Arabic normalization
        (أ/إ/آ = ا, ى = ي, ة = ه, diacritics ignored). Only this store's
        products are ever returned (ADR-0013). The index is updated within
        seconds of a change. Without `q`, newest first.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          schema: { type: string, enum: [draft, active, archived] }
        - name: category_id
          in: query
          schema: { $ref: "#/components/schemas/ULID" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 1000, default: 0 }
      responses:
        "200":
          description: Hits, best match first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductSearchPage" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/products/{product_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/ProductID"
    get:
      tags: [catalog]
      operationId: getProduct
      summary: Get a product
      description: "Permission: catalog.read."
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        default:
          $ref: "#/components/responses/Problem"
    put:
      tags: [catalog]
      operationId: updateProduct
      summary: Replace a product
      description: |
        Permission: catalog.manage. Replaces fields, options, variants and
        categories. Variants with `id` keep their identity and stock;
        variants without one are created (with `on_hand`); variants left
        out are deleted. Stock of existing variants changes only through
        the inventory endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [catalog]
      operationId: deleteProduct
      summary: Delete a product
      description: "Permission: catalog.manage. Soft delete: the slug and SKUs become free."
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/products/{product_id}/images:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/ProductID"
    post:
      tags: [catalog]
      operationId: createImageUpload
      summary: Start an image upload
      description: |
        Permission: catalog.manage. Creates a `pending` image and returns a
        presigned upload: POST `upload.fields` plus the file (last, as
        `file`) as multipart/form-data to `upload.url`, then call
        `completeImageUpload`. The storage service enforces the declared
        type and `upload.max_bytes`; the server then checks the real
        content, strips metadata and re-encodes it (ADR-0012). At most 20
        images per product; uploads not completed within an hour are
        discarded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageUploadRequest" }
      responses:
        "201":
          description: The pending image and its upload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageUpload" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/products/{product_id}/images/{image_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/ProductID"
      - $ref: "#/components/parameters/ImageID"
    patch:
      tags: [catalog]
      operationId: updateImage
      summary: Set an image's alt text and position
      description: "Permission: catalog.manage."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageInput" }
      responses:
        "200":
          description: The image.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductImage" }
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [catalog]
      operationId: deleteImage
      summary: Delete an image
      description: "Permission: catalog.manage. Its files are removed in the background."
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/products/{product_id}/images/{image_id}/complete:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/ProductID"
      - $ref: "#/components/parameters/ImageID"
    post:
      tags: [catalog]
      operationId: completeImageUpload
      summary: Process an uploaded image
      description: |
        Permission: catalog.manage. Call after the upload succeeded. The
        image becomes `processing`, then `ready` (with `urls`) or `failed`
        (with `failure_reason`). Repeating the call is harmless.
      responses:
        "202":
          description: Processing started (or already done).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductImage" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/imports:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [catalog]
      operationId: listImports
      summary: The store's latest imports
      description: "Permission: imports.manage. The 50 newest, newest first."
      responses:
        "200":
          description: Imports.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportList" }
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [catalog]
      operationId: createImport
      summary: Create a product import
      description: |
        Permission: imports.manage (ADR-0014). For `csv`, upload
        the file with the returned presigned POST (as for images), then call
        `startImport`. For `woocommerce`, send the shop's https URL and a
        read-only REST API key pair; they are stored encrypted and never
        returned. Products are matched by handle/slug: existing ones are
        updated (variants matched by SKU), others created.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "201":
          description: The pending import (and the upload for files).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportCreated" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/imports/{import_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/ImportID"
    get:
      tags: [catalog]
      operationId: getImport
      summary: An import's progress and report
      description: "Permission: imports.manage. Poll while `queued` or `running`."
      responses:
        "200":
          description: The import.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Import" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/imports/{import_id}/start:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/ImportID"
    post:
      tags: [catalog]
      operationId: startImport
      summary: Start a pending import
      description: "Permission: imports.manage. 409 import_already_started when it is not pending."
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Import" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/inventory/low:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [catalog]
      operationId: listLowStock
      summary: Variants running low
      description: |
        Permission: catalog.read. Tracked variants of active products (sample
        products left out) with at most `threshold` units free to sell, the
        fewest first, and how many there are in all. The dashboard passes the
        store's low-stock setting (the storefront theme's `low_stock`).
      parameters:
        - name: threshold
          in: query
          schema: { type: integer, minimum: 0, maximum: 100, default: 5 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        "200":
          description: The variants running low.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      required: [variant_id, product_id, product_title, option_values, available]
                      properties:
                        variant_id: { $ref: "#/components/schemas/ULID" }
                        product_id: { $ref: "#/components/schemas/ULID" }
                        product_title: { type: string }
                        option_values: { type: array, items: { type: string } }
                        available: { type: integer }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/variants/{variant_id}/inventory:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/VariantID"
    put:
      tags: [catalog]
      operationId: setInventory
      summary: Set a variant's stock
      description: |
        Permission: inventory.manage. `on_hand` cannot go below the units
        currently reserved by checkouts (409 stock_below_reserved).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryInput" }
      responses:
        "200":
          description: The new stock level.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stock" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/categories:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [catalog]
      operationId: listCategories
      summary: List the category tree
      description: "Permission: catalog.read. Every category (at most 500), roots first."
      responses:
        "200":
          description: The categories.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryList" }
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [catalog]
      operationId: createCategory
      summary: Create a category
      description: "Permission: catalog.manage. At most 3 levels deep."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "201":
          description: The category.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/categories/{category_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/CategoryID"
    put:
      tags: [catalog]
      operationId: updateCategory
      summary: Replace or move a category
      description: "Permission: catalog.manage."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "200":
          description: The category.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [catalog]
      operationId: deleteCategory
      summary: Delete a category
      description: |
        Permission: catalog.manage. A category with subcategories cannot be
        deleted (409 category_has_children); its products simply leave it.
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/size-charts:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [catalog]
      operationId: listSizeCharts
      summary: List the size charts
      description: "Permission: catalog.read. Every size chart (at most 100), by name, with how many products use it."
      responses:
        "200":
          description: The size charts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SizeChartList" }
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [catalog]
      operationId: createSizeChart
      summary: Create a size chart
      description: |
        Permission: catalog.manage. Measurements are in centimetres; the
        column names are free and the first column is the size. At most
        100 per store (409 size_chart_limit).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SizeChartInput" }
      responses:
        "201":
          description: The size chart.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SizeChart" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/size-charts/{size_chart_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/SizeChartID"
    get:
      tags: [catalog]
      operationId: getSizeChart
      summary: Get a size chart
      description: "Permission: catalog.read."
      responses:
        "200":
          description: The size chart.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SizeChart" }
        default:
          $ref: "#/components/responses/Problem"
    put:
      tags: [catalog]
      operationId: updateSizeChart
      summary: Replace a size chart
      description: "Permission: catalog.manage. Every product using it shows the new chart."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SizeChartInput" }
      responses:
        "200":
          description: The size chart.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SizeChart" }
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [catalog]
      operationId: deleteSizeChart
      summary: Delete a size chart
      description: "Permission: catalog.manage. Its products simply lose the chart."
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/storefront/theme:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [storefront]
      operationId: getStorefrontTheme
      summary: Get the theme
      description: The saved theme, or the defaults with version 0.
      responses:
        "200":
          description: The theme.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Theme" }
        default:
          $ref: "#/components/responses/Problem"
    put:
      tags: [storefront]
      operationId: updateStorefrontTheme
      summary: Save the theme
      description: Body text must contrast with the background at least 4.5:1 (422 low_contrast).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThemeInput" }
      responses:
        "200":
          description: The saved theme.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Theme" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/storefront/logo:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [storefront]
      operationId: getStoreLogo
      summary: Get the logo and any upload in progress
      description: |
        `current` is the live logo; `latest` is the newest upload that is
        not live yet (pending, processing or failed with a reason).
      responses:
        "200":
          description: The logo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreLogo" }
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [storefront]
      operationId: deleteStoreLogo
      summary: Remove the logo
      description: 404 logo_not_found when there is none.
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/storefront/logo/uploads:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    post:
      tags: [storefront]
      operationId: createLogoUpload
      summary: Start a logo upload
      description: |
        Returns a presigned POST (PNG, JPEG or WebP, at most 2 MiB; SVG
        and GIF are refused). Upload the file, then call
        completeLogoUpload. The current logo stays live until the new one
        is processed; earlier unfinished uploads are abandoned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogoUploadRequest" }
      responses:
        "201":
          description: The pending upload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogoUpload" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/storefront/logo/uploads/{asset_id}/complete:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/AssetID"
    post:
      tags: [storefront]
      operationId: completeLogoUpload
      summary: Process an uploaded logo
      description: |
        Queues the re-encoding; poll getStoreLogo for the result. Repeating
        it is harmless; a rejected upload is 409 asset_failed.
      responses:
        "202":
          description: Processing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogoAsset" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/storefront/section-types:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [storefront]
      operationId: listSectionTypes
      summary: List section types with their settings schemas
      description: JSON Schema (2020-12) of each section type's settings, for the page editor.
      responses:
        "200":
          description: The section types.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SectionTypeList" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/storefront/home:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [storefront]
      operationId: getHomePage
      summary: Get the home page
      description: The saved home page, or the default one with version 0 and no id.
      responses:
        "200":
          description: The home page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Page" }
        default:
          $ref: "#/components/responses/Problem"
    put:
      tags: [storefront]
      operationId: saveHomePage
      summary: Save the home page
      description: The home page is always published; its slug is fixed and a body is not allowed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PageInput" }
      responses:
        "200":
          description: The saved home page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Page" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/storefront/draft:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [storefront]
      operationId: getStorefrontDraft
      summary: The unpublished theme and home page
      description: |
        Drafts (ADR-0036): what the merchant is editing. Shoppers see the
        published theme and home page until the draft is published. A part
        without edits is absent.
      responses:
        "200":
          description: The drafts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorefrontDraft" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/storefront/draft/theme:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    put:
      tags: [storefront]
      operationId: saveThemeDraft
      summary: Save the theme draft
      description: Validated as the theme is (422 low_contrast too); the live theme does not change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThemeSettings" }
      responses:
        "200":
          description: The drafts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorefrontDraft" }
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [storefront]
      operationId: discardThemeDraft
      summary: Discard the theme draft
      description: Back to the published theme. Idempotent.
      responses:
        "204":
          description: Discarded.
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/storefront/draft/theme/publish:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    post:
      tags: [storefront]
      operationId: publishThemeDraft
      summary: Publish the theme draft
      description: |
        The draft becomes the live theme over the version you read (409 version_conflict when it moved on; 409 no_draft without one), and the draft goes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishInput" }
      responses:
        "200":
          description: The live theme.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Theme" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/storefront/draft/home:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    put:
      tags: [storefront]
      operationId: saveHomeDraft
      summary: Save the home page draft
      description: Validated as the home page is; the live page does not change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HomeDraft" }
      responses:
        "200":
          description: The drafts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorefrontDraft" }
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [storefront]
      operationId: discardHomeDraft
      summary: Discard the home page draft
      description: Back to the published home page. Idempotent.
      responses:
        "204":
          description: Discarded.
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/storefront/draft/home/publish:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    post:
      tags: [storefront]
      operationId: publishHomeDraft
      summary: Publish the home page draft
      description: |
        The draft becomes the live home page over the version you read (0 when it was never saved), and the draft goes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishInput" }
      responses:
        "200":
          description: The live home page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Page" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/storefront/previews:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    post:
      tags: [storefront]
      operationId: createStorefrontPreview
      summary: A link to the shop with the drafts
      description: |
        Open the shop with `?preview=<token>`: for 30 minutes it shows the
        drafts, marked as a preview, never cached and never indexed. Only
        the token's hash is stored. At most 20 live links per store (409
        preview_limit).
      responses:
        "201":
          description: The preview token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorefrontPreview" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/storefront/pages:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [storefront]
      operationId: listLandingPages
      summary: List landing pages
      description: Every landing page by slug, without its sections.
      responses:
        "200":
          description: The landing pages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageList" }
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [storefront]
      operationId: createLandingPage
      summary: Create a landing page
      description: |
        At most 50 per store (409 page_limit). The slug is derived from the
        title when empty; a slug in use is 422 slug taken.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PageInput" }
      responses:
        "201":
          description: The landing page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Page" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/storefront/pages/{page_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/PageID"
    get:
      tags: [storefront]
      operationId: getLandingPage
      summary: Get a landing page
      responses:
        "200":
          description: The landing page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Page" }
        default:
          $ref: "#/components/responses/Problem"
    put:
      tags: [storefront]
      operationId: updateLandingPage
      summary: Replace a landing page
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PageInput" }
      responses:
        "200":
          description: The landing page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Page" }
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [storefront]
      operationId: deleteLandingPage
      summary: Delete a landing page
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/storefront/policies:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [storefront]
      operationId: listPolicies
      summary: List policies
      description: Every policy in display order; unwritten ones are drafts with version 0 and no id.
      responses:
        "200":
          description: The policies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageList" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/storefront/policies/{policy}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/PolicySlug"
    get:
      tags: [storefront]
      operationId: getPolicy
      summary: Get a policy
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Page" }
        default:
          $ref: "#/components/responses/Problem"
    put:
      tags: [storefront]
      operationId: savePolicy
      summary: Save a policy
      description: A policy has a plain-text body (paragraphs separated by blank lines) and no sections.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PageInput" }
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Page" }
        default:
          $ref: "#/components/responses/Problem"
  /admin/v1/auth/login:
    post:
      tags: [admin]
      operationId: adminLogin
      summary: Admin sign-in (password and TOTP code together)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLoginRequest" }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/AdminSessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuth" }
        default:
          $ref: "#/components/responses/Problem"
  /admin/v1/auth/logout:
    post:
      tags: [admin]
      operationId: adminLogout
      summary: End the admin session
      security:
        - adminSessionCookie: []
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie: { $ref: "#/components/headers/AdminSessionCookie" }
        default:
          $ref: "#/components/responses/Problem"
  /admin/v1/me:
    get:
      tags: [admin]
      operationId: adminMe
      summary: The signed-in admin
      security:
        - adminSessionCookie: []
      responses:
        "200":
          description: The admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProfile" }
        default:
          $ref: "#/components/responses/Problem"
  /admin/v1/stores:
    get:
      tags: [admin]
      operationId: adminListStores
      summary: Search every store
      security:
        - adminSessionCookie: []
      parameters:
        - name: query
          in: query
          description: Slug prefix or name substring.
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { type: string, enum: [active, suspended, closed] }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Stores, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStorePage" }
        default:
          $ref: "#/components/responses/Problem"
  /admin/v1/stores/{store_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [admin]
      operationId: adminGetStore
      summary: One store with its domains
      security:
        - adminSessionCookie: []
      responses:
        "200":
          description: The store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStoreDetail" }
        default:
          $ref: "#/components/responses/Problem"
  /admin/v1/stores/{store_id}/suspend:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    post:
      tags: [admin]
      operationId: adminSuspendStore
      summary: Suspend an active store (storefront answers 503)
      security:
        - adminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReason" }
      responses:
        "200":
          description: Suspended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        default:
          $ref: "#/components/responses/Problem"
  /admin/v1/stores/{store_id}/reactivate:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    post:
      tags: [admin]
      operationId: adminReactivateStore
      summary: Reactivate a suspended store
      security:
        - adminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReason" }
      responses:
        "200":
          description: Active again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        default:
          $ref: "#/components/responses/Problem"
  /admin/v1/audit-log:
    get:
      tags: [admin]
      operationId: adminAuditLog
      summary: Every admin action, newest first
      security:
        - adminSessionCookie: []
      parameters:
        - name: cursor
          in: query
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuditPage" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/onboarding:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [onboarding]
      operationId: getOnboarding
      summary: Get the setup wizard's state
      description: "Permission: store.read."
      responses:
        "200":
          description: The wizard's state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/onboarding/template:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    put:
      tags: [onboarding]
      operationId: chooseOnboardingTemplate
      summary: Choose the starter template and apply it
      description: |
        Permission: store.update. Only while the wizard is open (409
        onboarding_completed after). The template is applied in the
        background; poll getOnboarding until `template.status` is `ready`
        or `failed`. Choosing again applies the new choice; the last
        choice wins.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingTemplateInput" }
      responses:
        "202":
          description: Accepted; the template is being applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/onboarding/complete:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    post:
      tags: [onboarding]
      operationId: completeOnboarding
      summary: Close the setup wizard
      description: "Permission: store.update. Idempotent."
      responses:
        "200":
          description: The wizard is closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/customers:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [customers]
      operationId: listCustomers
      summary: List or look up customers
      description: |
        Permission: customers.read. Newest first; follow `next_cursor`.
        `q` is a phone number in any common format (exact match) or the
        start of a word of the name (at least 2 letters; Arabic letter
        forms match, so "احمد" finds "أحمد").
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 64 }
        - name: blocked
          in: query
          description: Only blocked customers (the block list).
          schema: { type: boolean, default: false }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPage" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/customers/blocks:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    post:
      tags: [customers]
      operationId: blockPhone
      summary: Block a phone number
      description: |
        Permission: customers.manage. Blocks the number whether or not it
        ever ordered (a customer is created for it). Blocking again keeps
        the first block time and replaces the reason.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockPhoneInput" }
      responses:
        "200":
          description: The blocked customer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/customers/{customer_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/CustomerID"
    get:
      tags: [customers]
      operationId: getCustomer
      summary: Get a customer
      description: "Permission: customers.read."
      responses:
        "200":
          description: The customer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/customers/{customer_id}/block:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/CustomerID"
    post:
      tags: [customers]
      operationId: blockCustomer
      summary: Block a customer
      description: "Permission: customers.manage. Idempotent; the reason is replaced."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockInput" }
      responses:
        "200":
          description: The customer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/customers/{customer_id}/unblock:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/CustomerID"
    post:
      tags: [customers]
      operationId: unblockCustomer
      summary: Lift a customer's block
      description: "Permission: customers.manage. Idempotent."
      responses:
        "200":
          description: The customer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/orders:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [orders]
      operationId: listOrders
      summary: List orders
      description: |
        Permission: orders.read. Newest first, without lines; follow
        `next_cursor`. Filters combine; `customer_id` is a customer's
        order history.
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OrderStatus" }
        - name: from
          in: query
          description: Created at or after (inclusive).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Created before (exclusive).
          schema: { type: string, format: date-time }
        - name: governorate
          in: query
          description: ISO 3166-2 code, e.g. EG-C.
          schema: { type: string, maxLength: 8 }
        - name: phone
          in: query
          schema: { type: string, maxLength: 64 }
        - name: customer_id
          in: query
          schema: { $ref: "#/components/schemas/ULID" }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPage" }
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [orders]
      operationId: createOrder
      summary: Enter an order (a phone order)
      description: |
        Permission: orders.manage. Prices come from the catalog; the stock
        is held and the customer recorded. Send an `Idempotency-Key` to
        make retries safe: the same key with the same request returns the
        first order (200, `Idempotent-Replayed: true`); with another
        request it is 409 idempotency_key_reused. A blocked customer is
        409 customer_blocked; short stock is 409 insufficient_stock.
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201":
          description: The new order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderDetail" }
        "200":
          description: The order a previous request with this key created.
          headers:
            Idempotent-Replayed:
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderDetail" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/orders/counts:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [orders]
      operationId: countOrders
      summary: Count orders by status
      description: |
        Permission: orders.read. Every status with its number of orders
        (0 when none), in one query: the dashboard's status tabs and the
        sidebar's pending badge.
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderCounts" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/orders/stats:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [orders]
      operationId: getOrderStats
      summary: Sum the store's orders for the dashboard home
      description: |
        Permission: orders.read. Days follow the store's time zone. Sales are
        every order placed in the period except cancelled and returned ones,
        which are summed apart; totals include shipping and the COD fee.
        `previous` is the same span one period earlier (today so far against
        yesterday until the same hour). `daily` is the last 30 days, oldest
        first, days without orders included.
      parameters:
        - name: range
          in: query
          schema: { type: string, enum: [today, 7d, 30d], default: today }
      responses:
        "200":
          description: The sums.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderStats" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/orders/transitions:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    post:
      tags: [orders]
      operationId: bulkTransitionOrders
      summary: Move many orders (bulk confirm)
      description: |
        Each order moves in its own transaction, so one that cannot move
        does not hold back the others; `results` follow `order_ids`. The
        permission is checked per order, as for one transition.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkTransitionInput" }
      responses:
        "200":
          description: One result per order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkTransitionResult" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/orders/export:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [orders]
      operationId: exportOrders
      summary: Export orders as CSV
      description: |
        Permission: orders.export. The list's filters; newest first, at
        most 100,000 rows (narrow the dates for more). UTF-8 with a BOM,
        times in the store's zone, plain decimal amounts; text that a
        spreadsheet would run as a formula starts with an apostrophe.
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OrderStatus" }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: governorate
          in: query
          schema: { type: string, maxLength: 8 }
      responses:
        "200":
          description: The CSV file.
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="orders-2026-10-22.csv"' }
          content:
            text/csv:
              schema: { type: string }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/orders/{order_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/OrderID"
    get:
      tags: [orders]
      operationId: getOrder
      summary: Get an order with its lines and timeline
      description: "Permission: orders.read."
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderDetail" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/orders/{order_id}/transitions:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/OrderID"
    post:
      tags: [orders]
      operationId: transitionOrder
      summary: Move an order to another status
      description: |
        The permission depends on the move (see the tag). Send the
        `version` you read to refuse a move if the order changed since
        (409 version_conflict).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransitionInput" }
      responses:
        "200":
          description: The order after the move.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/shipping:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [shipping]
      operationId: getShipping
      summary: The store's shipping settings and zones
      description: "Permission: shipping.read. Zones in display order."
      responses:
        "200":
          description: Settings (version 0 when never saved) and zones.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShippingConfig" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/shipping/settings:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    put:
      tags: [shipping]
      operationId: saveShippingSettings
      summary: Save the store-wide COD fee and free-shipping threshold
      description: "Permission: shipping.manage. Send version 0 the first time."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShippingSettingsInput" }
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShippingSettings" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/shipping/zones:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    post:
      tags: [shipping]
      operationId: createShippingZone
      summary: Add a delivery zone
      description: |
        Permission: shipping.manage. A governorate already in another zone
        is a validation error on `areas` (code `taken`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShippingZoneInput" }
      responses:
        "201":
          description: The zone, last in display order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShippingZone" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/shipping/zones/{zone_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - name: zone_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ULID" }
    put:
      tags: [shipping]
      operationId: updateShippingZone
      summary: Replace a zone (name, rates, governorates, cities)
      description: "Permission: shipping.manage. `version` is required."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShippingZoneInput" }
      responses:
        "200":
          description: The zone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShippingZone" }
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [shipping]
      operationId: deleteShippingZone
      summary: Delete a zone
      description: |
        Permission: shipping.manage. Its governorates are no longer
        delivered to, unless it was the last zone.
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/shipping/quote:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    post:
      tags: [shipping]
      operationId: quoteShipping
      summary: What delivering an order would cost
      description: "Permission: shipping.read. For checking a setup; orders are quoted the same way."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShippingQuoteInput" }
      responses:
        "200":
          description: The quote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShippingQuote" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/shipping/carriers:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [shipping]
      operationId: listCarrierConnections
      summary: The carriers available and the store's connections
      description: "Permission: shipping.read. Credentials are never returned."
      responses:
        "200":
          description: Available carriers and connections, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CarrierConnections" }
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [shipping]
      operationId: connectCarrier
      summary: Connect the store's account at a carrier
      description: |
        Permission: shipping.manage. The API key is checked with the
        carrier first (a refused key is a validation error on `api_key`),
        then stored encrypted. The response carries the webhook URL and a
        secret, shown only here: set them in the carrier's dashboard,
        sending the secret as the `X-Webhook-Secret` header (or, when the
        carrier allows no headers, as a `secret` query parameter). One
        active connection per carrier (409 carrier_already_connected).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectCarrierInput" }
      responses:
        "201":
          description: Connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CarrierConnected" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/shipping/carriers/{connection_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - name: connection_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ULID" }
    delete:
      tags: [shipping]
      operationId: disconnectCarrier
      summary: Disconnect a carrier account
      description: "Permission: shipping.manage. Its key is never used again; its webhooks are refused."
      responses:
        "204":
          description: Disconnected.
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/shipping/shipments:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [shipping]
      operationId: listShipments
      summary: The store's shipments, newest first
      description: "Permission: orders.read."
      parameters:
        - { name: order_id, in: query, schema: { $ref: "#/components/schemas/ULID" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ShipmentStatus" } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentPage" }
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [shipping]
      operationId: createShipments
      summary: Hand orders to a connected carrier
      description: |
        Permission: orders.fulfil. Each order must be ready_to_ship and
        have no live shipment. Shipments are created at the carrier in the
        background (status `requested`, then `created` with a tracking
        number, or `failed` with the carrier's reason); the order moves to
        shipped, delivered, failed_delivery or returned as the carrier
        reports the parcel moving. One result per order.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateShipmentsInput" }
      responses:
        "200":
          description: One result per order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipResults" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/shipping/shipments/{shipment_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - { name: shipment_id, in: path, required: true, schema: { $ref: "#/components/schemas/ULID" } }
    get:
      tags: [shipping]
      operationId: getShipment
      summary: A shipment with its timeline
      description: "Permission: orders.read."
      responses:
        "200":
          description: The shipment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentDetail" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/shipping/shipments/{shipment_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - { name: shipment_id, in: path, required: true, schema: { $ref: "#/components/schemas/ULID" } }
    post:
      tags: [shipping]
      operationId: cancelShipment
      summary: Cancel a shipment
      description: |
        Permission: orders.fulfil. A shipment the carrier has not created
        yet is cancelled at once; otherwise the carrier is asked in the
        background (`cancel_requested_at` is set) and refuses once the
        parcel is picked up. A final shipment is 409 shipment_not_cancellable.
      responses:
        "200":
          description: The shipment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/shipping/shipments/{shipment_id}/label:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - { name: shipment_id, in: path, required: true, schema: { $ref: "#/components/schemas/ULID" } }
    get:
      tags: [shipping]
      operationId: getShipmentLabel
      summary: The shipment's label (airway bill)
      description: "Permission: orders.read. 409 label_not_ready until the carrier issues it."
      responses:
        "200":
          description: The label.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/shipping/cod:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [shipping]
      operationId: getCODReport
      summary: Cash-on-delivery reconciliation
      description: |
        Permission: finance.read. For parcels delivered in [from, to)
        (default: the last 30 days), per carrier account: what they should
        bring in, what the carrier paid out (statement lines and API
        payouts), and what it still holds, aged by delivery date (0-7,
        8-14, 15+ days); plus paid-out lines that match no parcel.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CODReport" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/shipping/cod/held:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [shipping]
      operationId: listHeldCOD
      summary: Delivered parcels whose cash the carrier still holds
      description: "Permission: finance.read. Oldest delivery first."
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeldCODPage" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/shipping/cod/statements:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    post:
      tags: [shipping]
      operationId: importCODStatement
      summary: Import a carrier's settlement statement (CSV)
      description: |
        Permission: finance.manage. The statement a carrier's dashboard
        exports (Bosta has no settlements API), as CSV in UTF-8, comma or
        semicolon separated, at most 1 MiB and 20,000 lines. Columns are
        found by name: `tracking_number` and `amount` are required,
        `settled_at` and `reference` optional (common Arabic and English
        names are understood). Lines are matched to parcels by tracking
        number; importing a statement again adds nothing (a line is unique
        per account, tracking number and reference). Bad lines are skipped
        and listed (at most 100).
      parameters:
        - { name: connection_id, in: query, required: true, schema: { $ref: "#/components/schemas/ULID" } }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: What the import did.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CODStatementImport" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/payments/gateways:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [payments]
      operationId: listPaymentConnections
      summary: The gateways available and the store's connections
      description: "Permission: payments.manage. Keys are never returned."
      responses:
        "200":
          description: Available gateways and connections, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentConnections" }
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [payments]
      operationId: connectPaymentGateway
      summary: Connect the store's gateway account
      description: |
        Permission: payments.manage. Paste the keys from the gateway's
        dashboard (Paymob: secret key, public key, API key, HMAC secret
        and the card integration IDs). They are checked with the gateway
        first (refused keys are a validation error on `secret_key`), then
        stored encrypted. One active gateway per store (409
        gateway_already_connected). Card checkout is offered to shoppers
        from then on.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectPaymentGatewayInput" }
      responses:
        "201":
          description: Connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentConnection" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/payments/settings:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [payments]
      operationId: getPaymentSettings
      summary: Which payment method checkout starts on
      description: |
        Permission: payments.manage. `default_method` is what the merchant
        chose; `card_enabled` says whether a gateway is connected (card
        only counts then: without one, checkout offers cash on delivery
        alone).
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentSettings" }
        default:
          $ref: "#/components/responses/Problem"
    put:
      tags: [payments]
      operationId: updatePaymentSettings
      summary: Choose the payment method checkout starts on
      description: "Permission: payments.manage. The shopper can always switch."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentSettingsInput" }
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentSettings" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/payments/gateways/{connection_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - { name: connection_id, in: path, required: true, schema: { $ref: "#/components/schemas/ULID" } }
    delete:
      tags: [payments]
      operationId: disconnectPaymentGateway
      summary: Stop taking card payments
      description: |
        Permission: payments.manage. New card checkouts stop; payments
        already made are still followed and can still be refunded.
      responses:
        "204":
          description: Disconnected.
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/payments:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [payments]
      operationId: listPayments
      summary: The store's card payments, newest first
      description: "Permission: orders.read. With `order_id`, that order's payments (no paging)."
      parameters:
        - { name: order_id, in: query, schema: { $ref: "#/components/schemas/ULID" } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentPage" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/payments/{payment_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - { name: payment_id, in: path, required: true, schema: { $ref: "#/components/schemas/ULID" } }
    get:
      tags: [payments]
      operationId: getPayment
      summary: A payment with its refunds
      description: "Permission: orders.read."
      responses:
        "200":
          description: The payment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentDetail" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/payments/{payment_id}/refunds:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - { name: payment_id, in: path, required: true, schema: { $ref: "#/components/schemas/ULID" } }
    post:
      tags: [payments]
      operationId: refundPayment
      summary: Refund a card payment, in part or in full
      description: |
        Permission: payments.refund. The amount is reserved at once (two
        refunds can never exceed what was paid; more is a validation
        error on `amount_minor`) and asked from the gateway in the
        background: the refund is `requested`, then `succeeded` or
        `failed` with the gateway's reason. Only a paid or partly
        refunded payment can be refunded (409 payment_not_refundable).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundPaymentInput" }
      responses:
        "202":
          description: Requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRefund" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/pay/{store_id}/{order_id}:
    get:
      tags: [checkout]
      operationId: startCardPayment
      summary: Send a card order's shopper to the gateway
      description: |
        Opens (or reuses, within 30 minutes) the gateway's hosted page for
        a card order awaiting payment, and redirects there. When the order
        no longer awaits a payment (paid, cancelled) or the store stopped
        taking cards, it redirects straight to `return`. A `return` that
        is not an http(s) URL on one of the store's hosts is 404, as are
        unknown stores and orders. Rate-limited per client IP.
      security: []
      parameters:
        - $ref: "#/components/parameters/StoreID"
        - { name: order_id, in: path, required: true, schema: { $ref: "#/components/schemas/ULID" } }
        - name: return
          in: query
          required: true
          description: Where the shopper ends up (the store's thank-you page).
          schema: { type: string, maxLength: 2000 }
      responses:
        "303":
          description: To the gateway's page, or back to `return`.
          headers:
            Location: { schema: { type: string } }
        default:
          $ref: "#/components/responses/Problem"
  /v1/pay/{store_id}/{order_id}/return/{to}:
    get:
      tags: [checkout]
      operationId: finishCardPayment
      summary: The gateway sends the shopper back
      description: |
        Asks the gateway about the order's payment now (bounded; the
        webhook catches up otherwise), then redirects to `to`: the return
        URL given to startCardPayment, base64url-encoded so the gateway's
        own query parameters cannot change it. The same host check
        applies. The inquiry is rate-limited per client IP: past the
        limit the shopper is still sent back, without it (the webhook
        brings the payment).
      security: []
      parameters:
        - $ref: "#/components/parameters/StoreID"
        - { name: order_id, in: path, required: true, schema: { $ref: "#/components/schemas/ULID" } }
        - { name: to, in: path, required: true, schema: { type: string, maxLength: 2700 } }
      responses:
        "303":
          description: Back to the store.
          headers:
            Location: { schema: { type: string } }
        default:
          $ref: "#/components/responses/Problem"
  /v1/webhooks/{provider}/{store_id}/{connection_id}:
    post:
      tags: [webhooks]
      operationId: receiveWebhook
      summary: Receive a provider's webhook
      description: |
        The body is read as raw bytes (at most 64 KiB) and verified by the
        provider's own scheme (an HMAC, or a secret header) before
        anything is stored. The response says whether the delivery is new
        (`accepted`) or a replay (`duplicate`); both are 200 so the
        provider stops retrying. Unknown providers, stores and
        connections are 404.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9_]{1,31}$" }
        - $ref: "#/components/parameters/StoreID"
        - name: connection_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ULID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Accepted, or recognised as a replay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookReceipt" }
        default:
          $ref: "#/components/responses/Problem"
    get:
      tags: [webhooks]
      operationId: verifyWebhook
      summary: Answer a provider's URL handshake
      description: |
        For providers that verify a webhook URL before using it (Meta:
        `hub.mode=subscribe`, `hub.verify_token`, `hub.challenge`). When
        the token matches the connection's, the challenge is echoed as
        text; otherwise 401. Providers without a handshake, and unknown
        stores and connections, are 404.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9_]{1,31}$" }
        - $ref: "#/components/parameters/StoreID"
        - name: connection_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ULID" }
        - name: hub.mode
          in: query
          required: false
          schema: { type: string, maxLength: 32 }
        - name: hub.verify_token
          in: query
          required: false
          schema: { type: string, maxLength: 256 }
        - name: hub.challenge
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: The challenge, echoed.
          content:
            text/plain:
              schema: { type: string }
        default:
          $ref: "#/components/responses/Problem"
  /v1/webhooks/{provider}:
    post:
      tags: [webhooks]
      operationId: receivePlatformWebhook
      summary: Receive a webhook of a platform-owned account
      description: |
        For an account the platform owns and shares between stores (one
        WhatsApp number, ADR-0038). The body (at most 2 MiB: Meta batches
        up to 1,000 updates) is verified
        with the platform's secret, then split by the provider into the
        events of each store; each event is accepted once in its store.
        The status is `accepted` when any event is new, else `duplicate`.
        Providers without a platform account are 404.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9_]{1,31}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Accepted, or recognised as a replay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookReceipt" }
        default:
          $ref: "#/components/responses/Problem"
    get:
      tags: [webhooks]
      operationId: verifyPlatformWebhook
      summary: Answer a provider's URL handshake for a platform-owned account
      description: As verifyWebhook, against the platform's own token.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9_]{1,31}$" }
        - name: hub.mode
          in: query
          required: false
          schema: { type: string, maxLength: 32 }
        - name: hub.verify_token
          in: query
          required: false
          schema: { type: string, maxLength: 256 }
        - name: hub.challenge
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: The challenge, echoed.
          content:
            text/plain:
              schema: { type: string }
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: __Host-asid
      description: Super-admin console session (admin host only).
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-sid
      description: Dashboard session (ADR-0005).
    bearerToken:
      type: http
      scheme: bearer
      description: Mobile app session token (ADR-0005).
  headers:
    SessionCookie:
      description: |
        `__Host-sid=<token>; Path=/; Max-Age=…; HttpOnly; Secure; SameSite=Lax`
        (web clients; cleared on logout).
      schema: { type: string }
    AdminSessionCookie:
      description: "`__Host-asid=<token>; Path=/; HttpOnly; Secure; SameSite=Strict` (cleared on logout)."
      schema: { type: string }
  parameters:
    StoreID:
      name: store_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ULID" }
    DomainID:
      name: domain_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ULID" }
    ProductID:
      name: product_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ULID" }
    VariantID:
      name: variant_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ULID" }
    CategoryID:
      name: category_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ULID" }
    SizeChartID:
      name: size_chart_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ULID" }
    ImageID:
      name: image_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ULID" }
    ImportID:
      name: import_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ULID" }
    AssetID:
      name: asset_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ULID" }
    PageID:
      name: page_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ULID" }
    OrderID:
      name: order_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ULID" }
    CustomerID:
      name: customer_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ULID" }
    PolicySlug:
      name: policy
      in: path
      required: true
      schema:
        type: string
        enum: [shipping, refund, privacy, terms]
  responses:
    Problem:
      description: Error (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    ULID:
      type: string
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
      example: 01J9ZQ3W5Y8V4K2N6M7P0R1S2T
    SignupRequest:
      type: object
      required: [email, password, name, store]
      properties:
        email: { type: string, maxLength: 254, example: ahmed@example.com }
        password: { type: string, minLength: 10, maxLength: 128, format: password }
        name: { type: string, maxLength: 100, example: أحمد علي }
        store: { $ref: "#/components/schemas/NewStore" }
        client: { $ref: "#/components/schemas/ClientKind" }
    NewStore:
      type: object
      required: [name, slug, currency, locale, timezone]
      properties:
        name: { type: string, maxLength: 120 }
        slug: { type: string, maxLength: 63, example: ahmed-shop }
        currency: { type: string, enum: [EGP, SAR, AED] }
        locale: { type: string, enum: [ar, en] }
        timezone: { type: string, example: Africa/Cairo }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 512, format: password }
        client: { $ref: "#/components/schemas/ClientKind" }
    ClientKind:
      type: string
      enum: [web, mobile]
      default: web
      description: "`mobile` returns the session token in the body instead of a cookie."
    SlugAvailability:
      type: object
      required: [slug, available]
      properties:
        slug: { type: string, description: The address as it would be saved (lower case, trimmed). }
        available: { type: boolean }
        reason:
          type: string
          enum: [invalid, reserved, taken]
          description: Why it is not available.
    AuthResponse:
      type: object
      required: [user, expires_at]
      properties:
        user: { $ref: "#/components/schemas/User" }
        store_id:
          $ref: "#/components/schemas/ULID"
        expires_at: { type: string, format: date-time }
        token:
          type: string
          description: "Session token (mobile clients only). Send as `Authorization: Bearer <token>`."
    User:
      type: object
      required: [id, email, name, email_verified, mfa_enabled, created_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        email: { type: string }
        name: { type: string }
        email_verified: { type: boolean }
        phone: { type: string, description: "Verified number, E.164.", example: "+201012345678" }
        mfa_enabled: { type: boolean }
        created_at: { type: string, format: date-time }
    MFARequired:
      type: object
      required: [mfa_required, challenge_id, expires_at]
      properties:
        mfa_required: { type: boolean, enum: [true] }
        challenge_id: { $ref: "#/components/schemas/ULID" }
        expires_at: { type: string, format: date-time }
    MFAVerifyRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id: { type: string, maxLength: 26 }
        code: { type: string, maxLength: 32, description: 6-digit TOTP code or a recovery code. }
        client: { $ref: "#/components/schemas/ClientKind" }
    PhoneRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, maxLength: 32, example: "01012345678" }
        region:
          type: string
          enum: [EG, SA, AE, KW, QA, BH, OM]
          default: EG
          description: Country for numbers without a + prefix.
    CodeChallenge:
      type: object
      required: [challenge_id, expires_at]
      properties:
        challenge_id: { $ref: "#/components/schemas/ULID" }
        expires_at: { type: string, format: date-time }
    CodeVerifyRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id: { type: string, maxLength: 26 }
        code: { type: string, maxLength: 12 }
        client: { $ref: "#/components/schemas/ClientKind" }
    TOTPSetup:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: Base32 seed for manual entry. }
        otpauth_uri: { type: string }
    TOTPCode:
      type: object
      required: [code]
      properties:
        code: { type: string, maxLength: 12 }
    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items: { type: string, example: k3j5-a9xq-2mzt-7c4v }
    DisableTOTPRequest:
      type: object
      required: [password, code]
      properties:
        password: { type: string, maxLength: 512, format: password }
        code: { type: string, maxLength: 32 }
    Member:
      type: object
      required: [user_id, name, email, role, joined_at]
      properties:
        user_id: { $ref: "#/components/schemas/ULID" }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        joined_at: { type: string, format: date-time }
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }
    MemberRoleUpdate:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [manager, support, shipping] }
    NewInvitation:
      type: object
      required: [email, role]
      properties:
        email: { type: string, maxLength: 254 }
        role: { type: string, enum: [manager, support, shipping] }
    Invitation:
      type: object
      required: [id, email, role, created_at, expires_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        invited_by: { $ref: "#/components/schemas/ULID" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    InvitationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Invitation" }
    AcceptInvitationRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 128, description: The part after `#` in the invitation link. }
        name: { type: string, maxLength: 100, description: For a new account. }
        password: { type: string, maxLength: 128, format: password, description: For a new account. }
        client: { $ref: "#/components/schemas/ClientKind" }
    AcceptInvitationResponse:
      type: object
      required: [store_id, role, user]
      properties:
        store_id: { $ref: "#/components/schemas/ULID" }
        role: { $ref: "#/components/schemas/Role" }
        user: { $ref: "#/components/schemas/User" }
        expires_at: { type: string, format: date-time, description: Session expiry (new accounts). }
        token: { type: string, description: "Session token (new accounts, mobile clients)." }
    Me:
      type: object
      required: [user, memberships]
      properties:
        user: { $ref: "#/components/schemas/User" }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/Membership" }
    Membership:
      type: object
      required: [store_id, role]
      properties:
        store_id: { $ref: "#/components/schemas/ULID" }
        role: { $ref: "#/components/schemas/Role" }
    Role:
      type: string
      enum: [owner, manager, support, shipping]
    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SessionInfo" }
    SessionInfo:
      type: object
      required: [id, user_agent, ip_prefix, created_at, last_seen_at, expires_at, current]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        user_agent: { type: string }
        ip_prefix: { type: string, example: 203.0.113.0/24 }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean, description: This is the session making the request. }
    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        next_cursor: { type: string }
    AuditEntry:
      type: object
      required: [id, occurred_at, action, target_type, target_id, ip_prefix, metadata]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        occurred_at: { type: string, format: date-time }
        actor_user_id: { $ref: "#/components/schemas/ULID" }
        action: { type: string, example: domain.added }
        target_type: { type: string, example: domain }
        target_id: { type: string }
        ip_prefix: { type: string }
        metadata:
          type: object
          additionalProperties: true
    AdminLoginRequest:
      type: object
      required: [email, password, code]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 512, format: password }
        code: { type: string, maxLength: 12, description: Current 6-digit TOTP code. }
    AdminProfile:
      type: object
      required: [id, email, name]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        email: { type: string }
        name: { type: string }
        last_login_at: { type: string, format: date-time }
    AdminAuth:
      type: object
      required: [admin, expires_at]
      properties:
        admin: { $ref: "#/components/schemas/AdminProfile" }
        expires_at: { type: string, format: date-time }
    AdminReason:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500, description: Kept in the admin audit log. }
    AdminStoreSummary:
      type: object
      required: [store, primary_host]
      properties:
        store: { $ref: "#/components/schemas/Store" }
        primary_host: { type: string }
    AdminStorePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminStoreSummary" }
        next_cursor: { type: string }
    AdminStoreDetail:
      type: object
      required: [store, domains]
      properties:
        store: { $ref: "#/components/schemas/Store" }
        domains:
          type: array
          items: { $ref: "#/components/schemas/Domain" }
    AdminAuditEntry:
      type: object
      required: [id, occurred_at, action, target_type, target_id, ip_prefix, metadata]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        occurred_at: { type: string, format: date-time }
        admin_id: { $ref: "#/components/schemas/ULID" }
        action: { type: string, example: store.suspended }
        target_type: { type: string }
        target_id: { type: string }
        ip_prefix: { type: string }
        metadata:
          type: object
          additionalProperties: true
    AdminAuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminAuditEntry" }
        next_cursor: { type: string }
    Store:
      type: object
      required: [id, slug, name, status, plan, currency, locale, timezone, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        slug: { type: string, example: my-shop }
        name: { type: string, example: متجر أحمد }
        status: { type: string, enum: [active, suspended, closed] }
        plan: { type: string, enum: [free, basic, pro] }
        currency: { type: string, enum: [EGP, SAR, AED] }
        locale: { type: string, enum: [ar, en] }
        timezone: { type: string, example: Africa/Cairo }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StoreSettings:
      type: object
      required: [name, locale, timezone]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        locale: { type: string, enum: [ar, en] }
        timezone:
          type: string
          enum: [Africa/Cairo, Asia/Riyadh, Asia/Dubai, Asia/Kuwait, Asia/Qatar, Asia/Bahrain, Asia/Muscat, UTC]
    NewDomain:
      type: object
      required: [host]
      properties:
        host: { type: string, maxLength: 253, example: shop.example.com }
    Domain:
      type: object
      required: [id, host, kind, status, is_primary, created_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        host: { type: string, example: shop.example.com }
        kind: { type: string, enum: [subdomain, custom] }
        status: { type: string, enum: [pending, verified, failed] }
        is_primary: { type: boolean }
        failure_reason:
          type: string
          enum: [txt_record_not_found, dns_error, domain_taken, verification_timed_out]
        verification:
          $ref: "#/components/schemas/DomainVerification"
        routing:
          $ref: "#/components/schemas/DomainRouting"
        verified_at: { type: string, format: date-time }
        last_checked_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    DomainRouting:
      type: object
      description: |
        Where a custom domain must point so the store opens on it (ADR-0037).
        A subdomain (shop.example.com) takes one CNAME. An apex domain
        (example.com, example.com.eg) cannot have a CNAME at most DNS
        providers: it takes an ALIAS (ANAME, CNAME flattening) where the
        provider offers one, and the A and AAAA records otherwise. A and
        AAAA appear only when the platform has fixed addresses configured.
      required: [apex, records]
      properties:
        apex: { type: boolean, description: The domain is a registrable root (its own zone apex). }
        records:
          type: array
          items: { $ref: "#/components/schemas/DnsRecord" }
    DnsRecord:
      type: object
      required: [type, name, value]
      properties:
        type: { type: string, enum: [CNAME, ALIAS, A, AAAA] }
        name: { type: string, example: shop.example.com }
        value: { type: string, example: connect.iftahonline.com }
    DomainVerification:
      type: object
      description: The TXT record to publish (custom domains that are not verified yet).
      required: [record_type, name, value]
      properties:
        record_type: { type: string, enum: [TXT] }
        name: { type: string, example: _iftah-verify.shop.example.com }
        value: { type: string, example: iftah-verify=k3j5... }
    DomainList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Domain" }
    ProductOption:
      type: object
      required: [name, values]
      properties:
        name: { type: string, minLength: 1, maxLength: 50, example: المقاس }
        values:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 50 }
          example: [S, M, L]
        colors:
          type: array
          maxItems: 50
          description: |
            Present when the option is a colour (the storefront shows
            swatches): one entry per value, in value order, each "#rrggbb"
            or "" to let the storefront guess the colour from the value's
            name.
          items: { type: string, pattern: "^(#[0-9a-fA-F]{6})?$" }
          example: ["#1f2a44", "#ffffff", ""]
    ProductInput:
      type: object
      required: [title, variants]
      properties:
        title: { type: string, minLength: 1, maxLength: 200, example: تيشيرت قطن }
        slug: { type: string, maxLength: 120, description: Derived from the title when empty. }
        description: { type: string, maxLength: 20000 }
        status: { type: string, enum: [draft, active, archived], default: draft }
        options:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/ProductOption" }
        variants:
          type: array
          minItems: 1
          maxItems: 100
          description: Exactly one when there are no options.
          items: { $ref: "#/components/schemas/VariantInput" }
        category_ids:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ULID" }
        size_chart_id:
          $ref: "#/components/schemas/ULID"
          description: One of the store's size charts; absent for none.
    VariantInput:
      type: object
      required: [price_minor]
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        sku: { type: string, maxLength: 64 }
        option_values:
          type: array
          maxItems: 3
          description: One value per option, in option order.
          items: { type: string, maxLength: 50 }
        price_minor: { type: integer, format: int64, minimum: 0, example: 15000 }
        compare_at_minor: { type: integer, format: int64, minimum: 1, description: Must exceed price_minor. }
        tracked: { type: boolean, default: true, description: New variants only. }
        on_hand: { type: integer, minimum: 0, maximum: 1000000, default: 0, description: New variants only. }
        hidden:
          type: boolean
          default: false
          description: Off sale and not shown to shoppers; the variant and its stock are kept.

    Product:
      type: object
      required: [id, slug, title, description, status, options, variants, category_ids, images, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        slug: { type: string, example: تيشيرت-قطن }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [draft, active, archived] }
        options:
          type: array
          items: { $ref: "#/components/schemas/ProductOption" }
        variants:
          type: array
          items: { $ref: "#/components/schemas/Variant" }
        category_ids:
          type: array
          items: { $ref: "#/components/schemas/ULID" }
        images:
          type: array
          description: In position order; only `ready` images have `urls`.
          items: { $ref: "#/components/schemas/ProductImage" }
        sample:
          type: boolean
          description: |
            Added by the setup wizard's starter template (ADR-0034): shown on
            the storefront marked as a sample, never sellable, deleted with
            deleteSampleProducts. Absent means false.
        size_chart_id:
          $ref: "#/components/schemas/ULID"
          description: The product's size chart; absent for none.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ImportRequest:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [csv, woocommerce] }
        woocommerce: { $ref: "#/components/schemas/WooCommerceSource" }
    WooCommerceSource:
      type: object
      required: [url, consumer_key, consumer_secret]
      properties:
        url: { type: string, maxLength: 2048, example: https://shop.example.com }
        consumer_key: { type: string, maxLength: 200, example: ck_… }
        consumer_secret: { type: string, maxLength: 200, format: password }
    ImportCreated:
      type: object
      required: [import]
      properties:
        import: { $ref: "#/components/schemas/Import" }
        upload: { $ref: "#/components/schemas/PresignedUpload" }
    Import:
      type: object
      required: [id, kind, status, total, processed, created, updated, failed, row_errors, created_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        kind: { type: string, enum: [csv, woocommerce] }
        status: { type: string, enum: [pending, queued, running, succeeded, failed] }
        total: { type: integer, description: Products in the source (0 until known). }
        processed: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        failed: { type: integer }
        row_errors:
          type: array
          description: The first 100 records that could not be imported.
          items: { $ref: "#/components/schemas/ImportRowError" }
        failure_reason:
          type: string
          description: |
            Why a failed import could not read its source, e.g. bad_header,
            csv_malformed, not_utf8, upload_missing,
            woo_auth, woo_not_found, woo_blocked_address.
        woocommerce_url: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    ImportRowError:
      type: object
      required: [line, message]
      properties:
        line: { type: integer }
        message: { type: string }
    ImportList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Import" }
    ProductCounts:
      type: object
      required: [all, active, draft, archived]
      properties:
        all: { type: integer }
        active: { type: integer }
        draft: { type: integer }
        archived: { type: integer }
    ProductBulk:
      type: object
      required: [product_ids, action]
      properties:
        product_ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ULID" }
        action: { type: string, enum: [active, draft, archived, delete] }
    ProductSearchPage:
      type: object
      required: [items, estimated_total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProductSearchHit" }
        estimated_total: { type: integer, format: int64 }
    ProductSearchHit:
      type: object
      required: [id, title, slug, status, category_ids, price_minor, currency]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        title: { type: string }
        slug: { type: string }
        status: { type: string, enum: [draft, active, archived] }
        category_ids:
          type: array
          items: { $ref: "#/components/schemas/ULID" }
        price_minor: { type: integer, format: int64, description: The lowest variant price. }
        currency: { type: string, enum: [EGP, SAR, AED] }
        thumb: { $ref: "#/components/schemas/ImageFormats" }
    ProductImage:
      type: object
      required: [id, status, alt, position, created_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        status: { type: string, enum: [pending, processing, ready, failed] }
        alt: { type: string }
        position: { type: integer }
        width: { type: integer }
        height: { type: integer }
        failure_reason:
          type: string
          enum: [file_too_large, unsupported_type, too_many_pixels, corrupt_image, upload_missing]
        urls: { $ref: "#/components/schemas/ImageURLs" }
        created_at: { type: string, format: date-time }
    ImageURLs:
      type: object
      description: Signed imgproxy URLs, fitted into a square box and never enlarged (thumb 160, small 400, medium 800, large 1600 px).
      required: [thumb, small, medium, large]
      properties:
        thumb: { $ref: "#/components/schemas/ImageFormats" }
        small: { $ref: "#/components/schemas/ImageFormats" }
        medium: { $ref: "#/components/schemas/ImageFormats" }
        large: { $ref: "#/components/schemas/ImageFormats" }
    ImageFormats:
      type: object
      required: [avif, webp]
      properties:
        avif: { type: string, format: uri }
        webp: { type: string, format: uri }
    ImageInput:
      type: object
      properties:
        alt: { type: string, maxLength: 200 }
        position: { type: integer, minimum: 0, maximum: 100 }
    ImageUploadRequest:
      type: object
      required: [content_type]
      properties:
        content_type: { type: string, enum: [image/jpeg, image/png, image/webp, image/gif] }
        alt: { type: string, maxLength: 200 }
        position: { type: integer, minimum: 0, maximum: 100 }
    ImageUpload:
      type: object
      required: [image, upload]
      properties:
        image: { $ref: "#/components/schemas/ProductImage" }
        upload: { $ref: "#/components/schemas/PresignedUpload" }
    PresignedUpload:
      type: object
      required: [url, fields, expires_at, max_bytes]
      properties:
        url: { type: string, format: uri }
        fields:
          type: object
          additionalProperties: { type: string }
        expires_at: { type: string, format: date-time }
        max_bytes: { type: integer, format: int64 }
    Variant:
      type: object
      required: [id, option_values, price_minor, currency, position, stock]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        sku: { type: string }
        option_values:
          type: array
          items: { type: string }
        price_minor: { type: integer, format: int64 }
        compare_at_minor: { type: integer, format: int64 }
        currency: { type: string, enum: [EGP, SAR, AED] }
        position: { type: integer }
        hidden: { type: boolean, description: Off sale and not shown to shoppers; absent means false. }
        stock: { $ref: "#/components/schemas/Stock" }
    Stock:
      type: object
      required: [tracked, on_hand, reserved, available]
      properties:
        tracked: { type: boolean, description: Untracked stock never runs out. }
        on_hand: { type: integer }
        reserved: { type: integer, description: Held by checkouts that have not completed. }
        available: { type: integer, description: on_hand - reserved (meaningless when untracked). }
    InventoryInput:
      type: object
      required: [on_hand]
      properties:
        tracked: { type: boolean, default: true }
        on_hand: { type: integer, minimum: 0, maximum: 1000000 }
    ProductPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        next_cursor: { type: string }
    SizeChartInput:
      type: object
      required: [name, header, body]
      properties:
        name: { type: string, minLength: 1, maxLength: 60, description: For the merchant only., example: تيشيرتات رجالي }
        header:
          type: array
          minItems: 2
          maxItems: 8
          description: Column names; the first is the size.
          items: { type: string, minLength: 1, maxLength: 30 }
          example: [المقاس, الصدر, الطول]
        body:
          type: array
          minItems: 1
          maxItems: 30
          description: Rows as long as the header, in centimetres; a row's first cell (the size) is required.
          items:
            type: array
            minItems: 2
            maxItems: 8
            items: { type: string, maxLength: 30 }
          example: [[S, "96", "68"], [M, "102", "71"]]
    SizeChart:
      type: object
      required: [id, name, header, body, products, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        name: { type: string }
        header:
          type: array
          items: { type: string }
        body:
          type: array
          items:
            type: array
            items: { type: string }
        products: { type: integer, description: Live products using the chart. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SizeChartList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SizeChart" }
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120, example: ملابس رجالي }
        slug: { type: string, maxLength: 120, description: Derived from the name when empty. }
        parent_id: { $ref: "#/components/schemas/ULID" }
        position: { type: integer, minimum: 0, maximum: 10000, default: 0 }
    OrderStatus:
      type: string
      enum: [pending, confirmed, ready_to_ship, shipped, delivered, cancelled, failed_delivery, returned]
    Order:
      type: object
      required: [id, code, status, version, source, customer_id, name, phone, governorate, city, address, notes,
                 currency, subtotal_minor, shipping_minor, cod_fee_minor, total_minor, item_count, created_at, updated_at, status_changed_at,
                 payment_method, payment_status]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        code: { type: string, description: Short reference for people (the ID's last 8 characters)., example: 7P0R1S2T }
        status: { $ref: "#/components/schemas/OrderStatus" }
        version: { type: integer }
        source: { type: string, enum: [storefront, merchant] }
        customer_id: { $ref: "#/components/schemas/ULID" }
        name: { type: string }
        phone: { type: string, example: "+201012345678" }
        governorate: { type: string, example: EG-C }
        city: { type: string }
        address: { type: string }
        notes: { type: string }
        currency: { type: string, example: EGP }
        subtotal_minor: { type: integer, format: int64 }
        shipping_minor: { type: integer, format: int64, description: The delivery rate quoted when the order was placed (ADR-0025). }
        cod_fee_minor: { type: integer, format: int64, description: The cash-on-delivery fee quoted when the order was placed. }
        payment_method: { type: string, enum: [cod, card] }
        payment_status:
          type: string
          enum: [unpaid, awaiting, paid, partially_refunded, refunded]
          description: COD orders are unpaid until the carrier collects; card orders await the gateway, then are paid (ADR-0029).
        total_minor: { type: integer, format: int64, description: subtotal + shipping + COD fee. }
        item_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        status_changed_at: { type: string, format: date-time }
    OrderLine:
      type: object
      required: [variant_id, product_id, title, variant_title, sku, qty, unit_price_minor, total_minor]
      properties:
        variant_id: { $ref: "#/components/schemas/ULID" }
        product_id: { $ref: "#/components/schemas/ULID" }
        title: { type: string }
        variant_title: { type: string, example: M / أحمر }
        sku: { type: string }
        qty: { type: integer }
        unit_price_minor: { type: integer, format: int64 }
        total_minor: { type: integer, format: int64 }
    OrderEvent:
      type: object
      required: [id, to, note, at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        from: { $ref: "#/components/schemas/OrderStatus" }
        to: { $ref: "#/components/schemas/OrderStatus" }
        actor_user_id: { $ref: "#/components/schemas/ULID" }
        actor: { type: string, description: 'The system that made the move, e.g. "carrier:bosta" (no user).', example: "carrier:bosta" }
        note: { type: string }
        at: { type: string, format: date-time }
    OrderDetail:
      type: object
      required: [order, lines, events]
      properties:
        order: { $ref: "#/components/schemas/Order" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
        events:
          type: array
          description: The timeline, oldest first.
          items: { $ref: "#/components/schemas/OrderEvent" }
    OrderTally:
      type: object
      required: [orders, total_minor]
      properties:
        orders: { type: integer }
        total_minor: { type: integer, format: int64 }
    OrderStats:
      type: object
      required: [range, currency, from, to, sales, cod_orders, card_orders, previous, cancelled, returned, daily]
      properties:
        range: { type: string, enum: [today, 7d, 30d] }
        currency: { type: string, example: EGP }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        sales: { $ref: "#/components/schemas/OrderTally" }
        cod_orders: { type: integer, description: Orders within sales paid on delivery. }
        card_orders: { type: integer, description: Orders within sales paid by card. }
        previous: { $ref: "#/components/schemas/OrderTally" }
        cancelled: { $ref: "#/components/schemas/OrderTally" }
        returned: { $ref: "#/components/schemas/OrderTally" }
        daily:
          type: array
          items:
            type: object
            required: [date, sales_minor, orders]
            properties:
              date: { type: string, format: date }
              sales_minor: { type: integer, format: int64 }
              orders: { type: integer }
        oldest_pending_at: { type: string, format: date-time, description: When the oldest order waiting for confirmation came; absent when none waits. }
    OrderCounts:
      type: object
      required: [pending, confirmed, ready_to_ship, shipped, delivered, cancelled, failed_delivery, returned]
      properties:
        pending: { type: integer }
        confirmed: { type: integer }
        ready_to_ship: { type: integer }
        shipped: { type: integer }
        delivered: { type: integer }
        cancelled: { type: integer }
        failed_delivery: { type: integer }
        returned: { type: integer }
    OrderPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Order" }
        next_cursor: { type: string }
    OrderInput:
      type: object
      required: [name, phone, governorate, city, address, lines]
      properties:
        name: { type: string, maxLength: 120, example: منى أحمد }
        phone: { type: string, maxLength: 64, example: "010 1234 5678" }
        governorate: { type: string, maxLength: 8, example: EG-ALX }
        city: { type: string, maxLength: 80, example: سموحة }
        address: { type: string, maxLength: 300 }
        notes: { type: string, maxLength: 500, default: "" }
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [variant_id, qty]
            properties:
              variant_id: { $ref: "#/components/schemas/ULID" }
              qty: { type: integer, minimum: 1, maximum: 100 }
    TransitionInput:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/OrderStatus" }
        note: { type: string, maxLength: 500, default: "" }
        version: { type: integer, minimum: 1, description: The version you read; omit to move whatever the version. }
    BulkTransitionInput:
      type: object
      required: [order_ids, status]
      properties:
        order_ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ULID" }
        status: { $ref: "#/components/schemas/OrderStatus" }
        note: { type: string, maxLength: 500, default: "" }
    BulkTransitionResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/BulkResult" }
    BulkResult:
      type: object
      required: [order_id, ok]
      properties:
        order_id: { $ref: "#/components/schemas/ULID" }
        ok: { type: boolean }
        order: { $ref: "#/components/schemas/Order" }
        error: { $ref: "#/components/schemas/BulkError" }
    BulkError:
      type: object
      required: [code, detail]
      properties:
        code: { type: string, example: invalid_transition }
        detail: { type: string }
    Customer:
      type: object
      required: [id, phone, name, orders_count, blocked, block_reason, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        phone: { type: string, example: "+201012345678" }
        name: { type: string, description: The latest name given with an order. }
        orders_count: { type: integer }
        last_order_at: { type: string, format: date-time }
        blocked: { type: boolean }
        blocked_at: { type: string, format: date-time }
        block_reason: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CustomerPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Customer" }
        next_cursor: { type: string }
    BlockPhoneInput:
      type: object
      required: [phone]
      properties:
        phone: { type: string, minLength: 1, maxLength: 64, example: "010 1234 5678" }
        reason: { type: string, maxLength: 300, default: "" }
    BlockInput:
      type: object
      properties:
        reason: { type: string, maxLength: 300, default: "" }
    Category:
      type: object
      required: [id, slug, name, position, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        parent_id: { $ref: "#/components/schemas/ULID" }
        slug: { type: string }
        name: { type: string }
        position: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Category" }
    OnboardingActivity:
      type: string
      enum: [clothing, electronics, beauty, perfume, kids, food, home, other]
      description: What the store sells; picks the starter template.
    OnboardingLook:
      type: string
      enum: [classic, modern, soft]
    Onboarding:
      type: object
      required: [status, template]
      properties:
        status:
          type: string
          enum: [in_progress, completed]
          description: Whether the wizard is still open.
        activity: { $ref: "#/components/schemas/OnboardingActivity" }
        look: { $ref: "#/components/schemas/OnboardingLook" }
        color: { $ref: "#/components/schemas/Color" }
        template:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [none, preparing, ready, failed]
              description: "none: not chosen yet."
            version: { type: integer, description: The template version applied. }
        completed_at: { type: string, format: date-time }
    OnboardingTemplateInput:
      type: object
      required: [activity, look, color]
      properties:
        activity: { $ref: "#/components/schemas/OnboardingActivity" }
        look: { $ref: "#/components/schemas/OnboardingLook" }
        color: { $ref: "#/components/schemas/Color" }
    Color:
      type: string
      pattern: "^#[0-9a-fA-F]{6}$"
      example: "#0f766e"
    ThemeSettings:
      type: object
      required: [colors, font, radius]
      properties:
        colors:
          type: object
          required: [primary, accent, background, text]
          properties:
            primary: { $ref: "#/components/schemas/Color" }
            accent: { $ref: "#/components/schemas/Color" }
            background: { $ref: "#/components/schemas/Color" }
            text: { $ref: "#/components/schemas/Color" }
        font:
          type: string
          enum: [cairo, tajawal, ibm-plex-sans-arabic, noto-kufi-arabic, system]
          description: Self-hosted fonts only; system uses the device's font.
        radius:
          type: string
          enum: [none, small, medium, large]
        look:
          type: string
          enum: [classic, modern, soft]
          description: |
            The storefront's layout, chosen in the setup wizard (ADR-0034):
            classic puts the logo on its own centred row; modern shows larger
            product cards, fewer to a row; soft draws categories as circles on
            every screen. Absent keeps the original layout; saving without it
            returns to that.
        announcement:
          type: string
          maxLength: 120
          description: The bar above the header (one line, e.g. free shipping over 1,000); empty shows none.
        about:
          type: string
          maxLength: 300
          description: A few words on the store, in the footer.
        contact:
          type: object
          description: How shoppers reach the store; empty fields are not shown.
          properties:
            whatsapp: { type: string, maxLength: 32, description: "With its country code, e.g. +201012345678; stored in E.164." }
            email: { type: string, maxLength: 254 }
        low_stock:
          type: integer
          minimum: 0
          maximum: 10
          description: The product page says "only N left" when a variant has this many units or fewer; 0 turns it off. Responses always carry the value in force; on save, absent keeps the default (5).
    Theme:
      type: object
      required: [settings, version]
      properties:
        settings: { $ref: "#/components/schemas/ThemeSettings" }
        version: { type: integer, description: 0 until the theme is first saved. }
        updated_at: { type: string, format: date-time }
    ThemeInput:
      type: object
      required: [settings, version]
      properties:
        settings: { $ref: "#/components/schemas/ThemeSettings" }
        version: { type: integer, minimum: 0, description: The version you read; 0 for the first save. }
    LogoAsset:
      type: object
      required: [id, status]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        status:
          type: string
          enum: [pending, processing, ready, failed]
        failure_reason:
          type: string
          description: Why a failed upload was rejected (unsupported_type, file_too_large, too_many_pixels, corrupt_image, upload_missing).
        width: { type: integer }
        height: { type: integer }
        urls: { $ref: "#/components/schemas/ImageURLs" }
        created_at: { type: string, format: date-time }
    StoreLogo:
      type: object
      properties:
        current: { $ref: "#/components/schemas/LogoAsset" }
        latest: { $ref: "#/components/schemas/LogoAsset" }
    LogoUploadRequest:
      type: object
      required: [content_type]
      properties:
        content_type: { type: string, enum: [image/png, image/jpeg, image/webp] }
    LogoUpload:
      type: object
      required: [asset, upload]
      properties:
        asset: { $ref: "#/components/schemas/LogoAsset" }
        upload: { $ref: "#/components/schemas/PresignedUpload" }
    SectionType:
      type: string
      description: |
        A section's type. This list grows: new types are added within /v1
        (ADR-0032). Clients must accept a type they do not know, by
        skipping that section or showing it as unsupported, never by
        failing. Never treat the list as closed.
      enum: [hero, product_grid, product_landing, reviews, faq, trust_badges, countdown, category_tiles, promo_tiles, whatsapp_cta]
    SectionTypeInfo:
      type: object
      required: [type, schema]
