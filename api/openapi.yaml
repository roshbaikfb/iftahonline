          enum: [home, landing, policy]
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        sections:
          type: array
          items: { $ref: "#/components/schemas/Section" }
        body: { type: string }
        status:
          type: string
          enum: [draft, published]
        version: { type: integer, description: 0 for a default that was never saved. }
