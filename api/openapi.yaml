    ShippingConfig:
      type: object
      required: [currency, areas, settings, zones]
      properties:
        currency: { type: string, example: EGP }
        areas:
          type: array
          description: The governorates of the store's country, the codes zones are made of.
          items: { $ref: "#/components/schemas/ShippingArea" }
        settings: { $ref: "#/components/schemas/ShippingSettings" }
        zones:
          type: array
          items: { $ref: "#/components/schemas/ShippingZone" }
    ShippingQuoteInput:
      type: object
      required: [governorate, subtotal_minor]
      properties:
        governorate: { type: string, example: EG-C }
        city: { type: string, maxLength: 80 }
        subtotal_minor: { type: integer, format: int64, minimum: 0, maximum: 100000000000 }
    ShippingQuote:
      type: object
      required: [deliverable, shipping_minor, free_shipping, cod_fee_minor, currency]
      properties:
        deliverable: { type: boolean }
        zone_id: { $ref: "#/components/schemas/ULID" }
        shipping_minor: { type: integer, format: int64 }
        free_shipping: { type: boolean }
        cod_fee_minor: { type: integer, format: int64 }
        currency: { type: string }
        free_over_minor: { type: integer, format: int64, description: The free-shipping threshold in force (the zone's, else the store's); absent when there is none. }
        eta_min_days: { type: integer, description: How long delivery takes to the zone; absent when the merchant did not say. }
        eta_max_days: { type: integer }
    CarrierConnection:
      type: object
      required: [id, carrier, status, created_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        carrier: { type: string, example: bosta }
        status: { type: string, enum: [active, disconnected] }
        created_at: { type: string, format: date-time }
        disconnected_at: { type: string, format: date-time }
        webhook_url: { type: string, description: Where the carrier sends this connection's webhooks (active connections). }
    CarrierConnections:
      type: object
      required: [carriers, connections]
      properties:
        carriers:
          type: array
          description: Carriers this platform can connect.
          items: { type: string }
        connections:
          type: array
          items: { $ref: "#/components/schemas/CarrierConnection" }
    ConnectCarrierInput:
      type: object
      required: [carrier, api_key]
      properties:
        carrier: { type: string, example: bosta }
        api_key: { type: string, maxLength: 512, format: password }
    CarrierConnected:
      type: object
      required: [connection, webhook_url, webhook_secret]
      properties:
        connection: { $ref: "#/components/schemas/CarrierConnection" }
        webhook_url: { type: string }
        webhook_secret: { type: string, description: Shown only in this response. }
    ShipmentStatus:
      type: string
      enum: [requested, created, in_transit, out_for_delivery, delivered, failed_attempt, returned, cancelled, failed]
    Shipment:
      type: object
      required: [id, order_id, connection_id, carrier, status, cod_minor, currency, label_ready, status_at, created_at, version]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        order_id: { $ref: "#/components/schemas/ULID" }
        connection_id: { $ref: "#/components/schemas/ULID" }
        carrier: { type: string, example: bosta }
        status: { $ref: "#/components/schemas/ShipmentStatus" }
        tracking_number: { type: string }
        cod_minor: { type: integer, format: int64, description: What the courier collects. }
        currency: { type: string }
        label_ready: { type: boolean }
        carrier_state: { type: string, description: The carrier's own last state, for support. }
        failure: { type: string, description: Why the carrier refused the shipment (status failed). }
        cancel_requested_at: { type: string, format: date-time }
        status_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        version: { type: integer }
    ShipmentEvent:
      type: object
      required: [id, status, source, note, at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        status: { $ref: "#/components/schemas/ShipmentStatus" }
        carrier_state: { type: string }
        source: { type: string, enum: [api, webhook, poll, merchant] }
        note: { type: string }
        at: { type: string, format: date-time }
    PaymentConnections:
      type: object
      required: [gateways, connections]
      properties:
        gateways:
          type: array
          description: Gateways this platform can connect.
          items: { type: string }
        connections:
          type: array
          items: { $ref: "#/components/schemas/PaymentConnection" }
    PaymentConnection:
      type: object
      required: [id, gateway, status, created_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        gateway: { type: string, example: paymob }
        status: { type: string, enum: [active, disconnected] }
        created_at: { type: string, format: date-time }
        disconnected_at: { type: string, format: date-time }
        webhook_url:
          type: string
          description: Where the gateway notifies this connection's payments (sent with every payment; active connections).
    ConnectPaymentGatewayInput:
      type: object
      required: [gateway, api_key, webhook_secret]
      properties:
        gateway: { type: string, example: paymob }
        secret_key: { type: string, maxLength: 512, format: password }
        public_key: { type: string, maxLength: 512 }
        api_key: { type: string, maxLength: 1024, format: password }
        webhook_secret: { type: string, maxLength: 512, format: password, description: "The gateway's webhook signing secret (Paymob: HMAC)." }
        integration_ids:
          type: array
          maxItems: 10
          description: The gateway's card integration IDs (Paymob).
          items: { type: integer, minimum: 1 }
    PaymentStatus:
      type: string
      enum: [pending, paid, failed, expired, partially_refunded, refunded]
    Payment:
      type: object
      required: [id, order_id, connection_id, gateway, status, amount_minor, refunded_minor, currency, status_at, created_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        order_id: { $ref: "#/components/schemas/ULID" }
        connection_id: { $ref: "#/components/schemas/ULID" }
        gateway: { type: string, example: paymob }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        amount_minor: { type: integer, format: int64 }
        refunded_minor: { type: integer, format: int64 }
        currency: { type: string, example: EGP }
        transaction_id: { type: string, description: "The gateway's transaction, for support." }
        failure: { type: string, description: Why the payment failed. }
        status_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    PaymentRefund:
      type: object
      required: [id, payment_id, amount_minor, currency, status, reason, created_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        payment_id: { $ref: "#/components/schemas/ULID" }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        status: { type: string, enum: [requested, succeeded, failed] }
        reason: { type: string }
        failure: { type: string }
        created_at: { type: string, format: date-time }
    PaymentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        next_cursor: { type: string }
    PaymentDetail:
      type: object
      required: [payment, refunds]
      properties:
        payment: { $ref: "#/components/schemas/Payment" }
        refunds:
          type: array
          items: { $ref: "#/components/schemas/PaymentRefund" }
    RefundPaymentInput:
      type: object
      required: [amount_minor]
      properties:
        amount_minor: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, maxLength: 300 }
    ShipmentDetail:
      type: object
      required: [shipment, events]
      properties:
        shipment: { $ref: "#/components/schemas/Shipment" }
        events:
          type: array
          items: { $ref: "#/components/schemas/ShipmentEvent" }
    ShipmentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Shipment" }
        next_cursor: { type: string }
    CreateShipmentsInput:
      type: object
      required: [connection_id, order_ids]
      properties:
        connection_id: { $ref: "#/components/schemas/ULID" }
        order_ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ULID" }
    ShipResult:
      type: object
      required: [order_id]
      properties:
        order_id: { $ref: "#/components/schemas/ULID" }
        shipment: { $ref: "#/components/schemas/Shipment" }
        error: { $ref: "#/components/schemas/BulkError" }
    ShipResults:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/ShipResult" }
    CODCarrier:
      type: object
      required: [connection_id, carrier, currency, delivered, expected_minor, settled_minor, held_minor, held_0_7_minor, held_8_14_minor, held_15_plus_minor, over_settled]
      properties:
        connection_id: { $ref: "#/components/schemas/ULID" }
        carrier: { type: string }
        currency: { type: string }
        delivered: { type: integer, description: Delivered COD parcels. }
        expected_minor: { type: integer, format: int64 }
        settled_minor: { type: integer, format: int64 }
        held_minor: { type: integer, format: int64, description: Still at the carrier. }
        held_0_7_minor: { type: integer, format: int64 }
        held_8_14_minor: { type: integer, format: int64 }
        held_15_plus_minor: { type: integer, format: int64 }
        over_settled: { type: integer, description: Parcels paid out more than their COD. }
    CODReport:
      type: object
      required: [from, to, carriers, unmatched_lines, unmatched_minor]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        carriers:
          type: array
          items: { $ref: "#/components/schemas/CODCarrier" }
        unmatched_lines: { type: integer, description: Paid-out lines that match no parcel. }
        unmatched_minor: { type: integer, format: int64 }
    HeldCOD:
      type: object
      required: [shipment_id, order_id, carrier, tracking_number, currency, expected_minor, settled_minor, held_minor, delivered_at]
      properties:
        shipment_id: { $ref: "#/components/schemas/ULID" }
        order_id: { $ref: "#/components/schemas/ULID" }
        carrier: { type: string }
        tracking_number: { type: string }
        currency: { type: string }
        expected_minor: { type: integer, format: int64 }
        settled_minor: { type: integer, format: int64 }
        held_minor: { type: integer, format: int64 }
        delivered_at: { type: string, format: date-time }
    HeldCODPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/HeldCOD" }
        next_cursor: { type: string }
    CODStatementImport:
      type: object
      required: [lines, imported, duplicates, matched, errors]
      properties:
        lines: { type: integer, description: Lines read (excluding the header and blank lines). }
        imported: { type: integer }
        duplicates: { type: integer, description: Lines already imported. }
        matched: { type: integer, description: New lines matched to a parcel. }
        errors:
          type: array
          items:
            type: object
            required: [line, message]
            properties:
              line: { type: integer }
              message: { type: string }
    WebhookReceipt:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted, duplicate] }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, example: "urn:iftahonline:problem:not-found" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: Stable machine-readable error code. }
        request_id: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
