        default_method: { type: string, enum: [cod, card] }
    PaymentSettings:
      type: object
      required: [default_method, card_enabled]
      properties:
        default_method: { type: string, enum: [cod, card] }
        card_enabled: { type: boolean }
    PageInput:
      type: object
      properties:
