openapi: 3.0.3
info:
  title: iftahonline platform API
  version: 1.0.0
  description: |
    Contract for the merchant dashboard, the mobile app and integrations.
    Change this file first, regenerate (`make gen`), then implement
    (CLAUDE.md rule 11). Breaking changes inside /v1 fail CI (oasdiff).

    Errors use RFC 9457 `application/problem+json`.
servers:
  - url: /
# Every operation needs a session unless it declares `security: []`.
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: system
    description: Process health and build metadata.
  - name: identity
    description: |
      Accounts, sign-up, sessions and the store audit log (ADR-0005). The
      dashboard authenticates with the `__Host-sid` cookie set by sign-up
      and login; the mobile app sends `"client": "mobile"` and uses the
      returned token as a bearer token.
  - name: admin
    description: |
      The super-admin console (ADR-0005 §8). Served only on the admin
      host (ADMIN_HOST, e.g. admin.iftahonline.com); every other host
      gets 404. Admins are separate from merchant users, sign in with
      password and TOTP together, and every action is recorded in the
      append-only admin audit log.
  - name: tenancy
    description: |
      The store and its domains. Every path is scoped to one store; a
      caller who is not a member of that store gets 404 (ADR-0006).
  - name: catalog
    description: |
      Products, variants, stock and categories (ADR-0011). Every path is
      scoped to one store; a caller who is not a member of that store, or
      who names another store's product, variant or category, gets 404.
      Prices are integer minor units in the store's currency.
paths:
  /livez:
    get:
      tags: [system]
      operationId: getLivez
      summary: Liveness probe
      description: 200 while the process is running. Never checks dependencies.
      security: []
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      tags: [system]
      operationId: getReadyz
      summary: Readiness probe
      description: |
        200 when every dependency answers; 503 when one fails or the process
        is draining before shutdown.
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Not ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /v1/meta/version:
    get:
      tags: [system]
      operationId: getVersion
      summary: Build information
      security: []
      responses:
        "200":
          description: Build information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/signup:
    post:
      tags: [identity]
      operationId: signup
      summary: Create an account and its first store
      description: |
        Creates the user, the store with its `<slug>.iftahonline.com`
        subdomain, the owner membership and a session, atomically.
        Rate-limited per IP. Store field errors are reported as
        `store.<field>`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201":
          description: Signed up and signed in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/login:
    post:
      tags: [identity]
      operationId: login
      summary: Sign in with email and password
      description: |
        Wrong email, wrong password and disabled accounts get the same 401.
        Repeated failures for one email are refused with 429 until the
        budget refills; attempts are also limited per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "202":
          description: Password accepted; complete sign-in with `POST /v1/auth/mfa`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFARequired" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/mfa:
    post:
      tags: [identity]
      operationId: verifyMFA
      summary: Complete sign-in with a TOTP or recovery code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MFAVerifyRequest" }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/otp/start:
    post:
      tags: [identity]
      operationId: startOTPLogin
      summary: Send a sign-in code to a verified phone
      description: |
        Always answers 202 with a challenge, whether or not the number has
        an account. Limited per number (1/min, 10/day) and per IP. 503
        while no SMS/WhatsApp provider is configured.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneRequest" }
      responses:
        "202":
          description: A code was sent if the number has an account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeChallenge" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/otp/verify:
    post:
      tags: [identity]
      operationId: verifyOTPLogin
      summary: Sign in with the code from the phone
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeVerifyRequest" }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "202":
          description: Code accepted; complete sign-in with `POST /v1/auth/mfa`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFARequired" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/invitations/accept:
    post:
      tags: [identity]
      operationId: acceptInvitation
      summary: Join a store from an invitation link
      description: |
        If the invited email has an account, the caller must be signed in
        as it. Otherwise `name` and `password` create the account and a
        session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInvitationRequest" }
      responses:
        "200":
          description: Joined.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptInvitationResponse" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/logout:
    post:
      tags: [identity]
      operationId: logout
      summary: End the current session
      responses:
        "204":
          description: Signed out; the cookie is cleared.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/me:
    get:
      tags: [identity]
      operationId: getMe
      summary: The signed-in user and their stores
      responses:
        "200":
          description: The user and their memberships.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/phone:
    post:
      tags: [identity]
      operationId: startPhoneVerification
      summary: Send a code to a phone number to add to the account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneRequest" }
      responses:
        "202":
          description: Code sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeChallenge" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/phone/verify:
    post:
      tags: [identity]
      operationId: verifyPhone
      summary: Confirm the phone number with the received code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeVerifyRequest" }
      responses:
        "204":
          description: Phone verified; it can now be used for sign-in.
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/mfa/totp:
    post:
      tags: [identity]
      operationId: setupTOTP
      summary: Start two-factor enrolment
      responses:
        "200":
          description: Seed to add to an authenticator app (show as a QR code).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TOTPSetup" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/mfa/totp/confirm:
    post:
      tags: [identity]
      operationId: confirmTOTP
      summary: Enable two-factor authentication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TOTPCode" }
      responses:
        "200":
          description: Enabled. The recovery codes are shown only now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/mfa/totp/disable:
    post:
      tags: [identity]
      operationId: disableTOTP
      summary: Disable two-factor authentication
      description: Needs the password and a current code (or a recovery code).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisableTOTPRequest" }
      responses:
        "204":
          description: Disabled.
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/sessions:
    get:
      tags: [identity]
      operationId: listMySessions
      summary: The signed-in user's active sessions
      responses:
        "200":
          description: Sessions, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ULID" }
    delete:
      tags: [identity]
      operationId: revokeMySession
      summary: Sign out one device
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/members:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [identity]
      operationId: listMembers
      summary: The store's team
      description: "Permission: members.read."
      responses:
        "200":
          description: Members, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - name: user_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ULID" }
    patch:
      tags: [identity]
      operationId: updateMemberRole
      summary: Change a member's role
      description: "Permission: members.manage. The owner's role cannot be changed."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberRoleUpdate" }
      responses:
        "204":
          description: Changed.
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [identity]
      operationId: removeMember
      summary: Remove a member from the store
      description: "Permission: members.manage. The owner cannot be removed."
      responses:
        "204":
          description: Removed; their next request to this store gets 404.
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/invitations:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [identity]
      operationId: listInvitations
      summary: Open invitations
      description: "Permission: members.manage."
      responses:
        "200":
          description: Open invitations, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationList" }
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [identity]
      operationId: createInvitation
      summary: Invite someone to the team by email
      description: "Permission: members.manage. The link is emailed and valid for 7 days."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewInvitation" }
      responses:
        "201":
          description: Invitation created and queued for email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/invitations/{invitation_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - name: invitation_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ULID" }
    delete:
      tags: [identity]
      operationId: revokeInvitation
      summary: Cancel an open invitation
      description: "Permission: members.manage."
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/audit-log:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [identity]
      operationId: listAuditLog
      summary: The store's audit log
      description: "Permission: audit.read. Newest first; follow `next_cursor`."
      parameters:
        - name: cursor
          in: query
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [tenancy]
      operationId: getStore
      summary: Get the store
      description: "Permission: store.read."
      responses:
        "200":
          description: The store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [tenancy]
      operationId: updateStore
      summary: Update store settings
      description: "Permission: store.update. Currency and plan are not editable here."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreSettings" }
      responses:
        "200":
          description: The updated store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/domains:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [tenancy]
      operationId: listDomains
      summary: List the store's domains
      description: "Permission: domains.read."
      responses:
        "200":
          description: Domains, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainList" }
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [tenancy]
      operationId: addDomain
      summary: Add a custom domain
      description: |
        Permission: domains.manage. The domain starts as `pending`; publish
        the returned TXT record, and it is verified automatically (checked
        with backoff for about three days).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewDomain" }
      responses:
        "201":
          description: The pending domain.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/domains/{domain_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/DomainID"
    delete:
      tags: [tenancy]
      operationId: deleteDomain
      summary: Remove a custom domain
      description: "Permission: domains.manage. The platform subdomain and the primary domain cannot be removed."
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/domains/{domain_id}/verify:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/DomainID"
    post:
      tags: [tenancy]
      operationId: verifyDomain
      summary: Check a pending or failed domain again now
      description: "Permission: domains.manage."
      responses:
        "202":
          description: Verification restarted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/domains/{domain_id}/primary:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/DomainID"
    post:
      tags: [tenancy]
      operationId: setPrimaryDomain
      summary: Make a verified domain the canonical host
      description: "Permission: domains.manage."
      responses:
        "200":
          description: The new primary domain.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/products:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [catalog]
      operationId: listProducts
      summary: List products
      description: |
        Permission: catalog.read. Newest first, with variants, stock and
        category IDs; follow `next_cursor`. Deleted products are never listed.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, active, archived] }
        - name: category_id
          in: query
          schema: { $ref: "#/components/schemas/ULID" }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductPage" }
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [catalog]
      operationId: createProduct
      summary: Create a product
      description: |
        Permission: catalog.manage. Without `slug`, one is derived from the
        title (Arabic letters are kept). Variants must not carry `id`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: The product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/products/{product_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/ProductID"
    get:
      tags: [catalog]
      operationId: getProduct
      summary: Get a product
      description: "Permission: catalog.read."
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        default:
          $ref: "#/components/responses/Problem"
    put:
      tags: [catalog]
      operationId: updateProduct
      summary: Replace a product
      description: |
        Permission: catalog.manage. Replaces fields, options, variants and
        categories. Variants with `id` keep their identity and stock;
        variants without one are created (with `on_hand`); variants left
        out are deleted. Stock of existing variants changes only through
        the inventory endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [catalog]
      operationId: deleteProduct
      summary: Delete a product
      description: "Permission: catalog.manage. Soft delete: the slug and SKUs become free."
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/variants/{variant_id}/inventory:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/VariantID"
    put:
      tags: [catalog]
      operationId: setInventory
      summary: Set a variant's stock
      description: |
        Permission: inventory.manage. `on_hand` cannot go below the units
        currently reserved by checkouts (409 stock_below_reserved).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryInput" }
      responses:
        "200":
          description: The new stock level.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stock" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/categories:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [catalog]
      operationId: listCategories
      summary: List the category tree
      description: "Permission: catalog.read. Every category (at most 500), roots first."
      responses:
        "200":
          description: The categories.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryList" }
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [catalog]
      operationId: createCategory
      summary: Create a category
      description: "Permission: catalog.manage. At most 3 levels deep."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "201":
          description: The category.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/stores/{store_id}/categories/{category_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
      - $ref: "#/components/parameters/CategoryID"
    put:
      tags: [catalog]
      operationId: updateCategory
      summary: Replace or move a category
      description: "Permission: catalog.manage."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "200":
          description: The category.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [catalog]
      operationId: deleteCategory
      summary: Delete a category
      description: |
        Permission: catalog.manage. A category with subcategories cannot be
        deleted (409 category_has_children); its products simply leave it.
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /admin/v1/auth/login:
    post:
      tags: [admin]
      operationId: adminLogin
      summary: Admin sign-in (password and TOTP code together)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLoginRequest" }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/AdminSessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuth" }
        default:
          $ref: "#/components/responses/Problem"
  /admin/v1/auth/logout:
    post:
      tags: [admin]
      operationId: adminLogout
      summary: End the admin session
      security:
        - adminSessionCookie: []
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie: { $ref: "#/components/headers/AdminSessionCookie" }
        default:
          $ref: "#/components/responses/Problem"
  /admin/v1/me:
    get:
      tags: [admin]
      operationId: adminMe
      summary: The signed-in admin
      security:
        - adminSessionCookie: []
      responses:
        "200":
          description: The admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProfile" }
        default:
          $ref: "#/components/responses/Problem"
  /admin/v1/stores:
    get:
      tags: [admin]
      operationId: adminListStores
      summary: Search every store
      security:
        - adminSessionCookie: []
      parameters:
        - name: query
          in: query
          description: Slug prefix or name substring.
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { type: string, enum: [active, suspended, closed] }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Stores, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStorePage" }
        default:
          $ref: "#/components/responses/Problem"
  /admin/v1/stores/{store_id}:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    get:
      tags: [admin]
      operationId: adminGetStore
      summary: One store with its domains
      security:
        - adminSessionCookie: []
      responses:
        "200":
          description: The store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStoreDetail" }
        default:
          $ref: "#/components/responses/Problem"
  /admin/v1/stores/{store_id}/suspend:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    post:
      tags: [admin]
      operationId: adminSuspendStore
      summary: Suspend an active store (storefront answers 503)
      security:
        - adminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReason" }
      responses:
        "200":
          description: Suspended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        default:
          $ref: "#/components/responses/Problem"
  /admin/v1/stores/{store_id}/reactivate:
    parameters:
      - $ref: "#/components/parameters/StoreID"
    post:
      tags: [admin]
      operationId: adminReactivateStore
      summary: Reactivate a suspended store
      security:
        - adminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReason" }
      responses:
        "200":
          description: Active again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        default:
          $ref: "#/components/responses/Problem"
  /admin/v1/audit-log:
    get:
      tags: [admin]
      operationId: adminAuditLog
      summary: Every admin action, newest first
      security:
        - adminSessionCookie: []
      parameters:
        - name: cursor
          in: query
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuditPage" }
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: __Host-asid
      description: Super-admin console session (admin host only).
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-sid
      description: Dashboard session (ADR-0005).
    bearerToken:
      type: http
      scheme: bearer
      description: Mobile app session token (ADR-0005).
  headers:
    SessionCookie:
      description: |
        `__Host-sid=<token>; Path=/; Max-Age=…; HttpOnly; Secure; SameSite=Lax`
        (web clients; cleared on logout).
      schema: { type: string }
    AdminSessionCookie:
      description: "`__Host-asid=<token>; Path=/; HttpOnly; Secure; SameSite=Strict` (cleared on logout)."
      schema: { type: string }
  parameters:
    StoreID:
      name: store_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ULID" }
    DomainID:
      name: domain_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ULID" }
    ProductID:
      name: product_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ULID" }
    VariantID:
      name: variant_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ULID" }
    CategoryID:
      name: category_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ULID" }
  responses:
    Problem:
      description: Error (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    ULID:
      type: string
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
      example: 01J9ZQ3W5Y8V4K2N6M7P0R1S2T
    SignupRequest:
      type: object
      required: [email, password, name, store]
      properties:
        email: { type: string, maxLength: 254, example: ahmed@example.com }
        password: { type: string, minLength: 10, maxLength: 128, format: password }
        name: { type: string, maxLength: 100, example: أحمد علي }
        store: { $ref: "#/components/schemas/NewStore" }
        client: { $ref: "#/components/schemas/ClientKind" }
    NewStore:
      type: object
      required: [name, slug, currency, locale, timezone]
      properties:
        name: { type: string, maxLength: 120 }
        slug: { type: string, maxLength: 63, example: ahmed-shop }
        currency: { type: string, enum: [EGP, SAR, AED] }
        locale: { type: string, enum: [ar, en] }
        timezone: { type: string, example: Africa/Cairo }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 512, format: password }
        client: { $ref: "#/components/schemas/ClientKind" }
    ClientKind:
      type: string
      enum: [web, mobile]
      default: web
      description: "`mobile` returns the session token in the body instead of a cookie."
    AuthResponse:
      type: object
      required: [user, expires_at]
      properties:
        user: { $ref: "#/components/schemas/User" }
        store_id:
          $ref: "#/components/schemas/ULID"
        expires_at: { type: string, format: date-time }
        token:
          type: string
          description: "Session token (mobile clients only). Send as `Authorization: Bearer <token>`."
    User:
      type: object
      required: [id, email, name, email_verified, mfa_enabled, created_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        email: { type: string }
        name: { type: string }
        email_verified: { type: boolean }
        phone: { type: string, description: "Verified number, E.164.", example: "+201012345678" }
        mfa_enabled: { type: boolean }
        created_at: { type: string, format: date-time }
    MFARequired:
      type: object
      required: [mfa_required, challenge_id, expires_at]
      properties:
        mfa_required: { type: boolean, enum: [true] }
        challenge_id: { $ref: "#/components/schemas/ULID" }
        expires_at: { type: string, format: date-time }
    MFAVerifyRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id: { type: string, maxLength: 26 }
        code: { type: string, maxLength: 32, description: 6-digit TOTP code or a recovery code. }
        client: { $ref: "#/components/schemas/ClientKind" }
    PhoneRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, maxLength: 32, example: "01012345678" }
        region:
          type: string
          enum: [EG, SA, AE, KW, QA, BH, OM]
          default: EG
          description: Country for numbers without a + prefix.
    CodeChallenge:
      type: object
      required: [challenge_id, expires_at]
      properties:
        challenge_id: { $ref: "#/components/schemas/ULID" }
        expires_at: { type: string, format: date-time }
    CodeVerifyRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id: { type: string, maxLength: 26 }
        code: { type: string, maxLength: 12 }
        client: { $ref: "#/components/schemas/ClientKind" }
    TOTPSetup:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: Base32 seed for manual entry. }
        otpauth_uri: { type: string }
    TOTPCode:
      type: object
      required: [code]
      properties:
        code: { type: string, maxLength: 12 }
    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items: { type: string, example: k3j5-a9xq-2mzt-7c4v }
    DisableTOTPRequest:
      type: object
      required: [password, code]
      properties:
        password: { type: string, maxLength: 512, format: password }
        code: { type: string, maxLength: 32 }
    Member:
      type: object
      required: [user_id, name, email, role, joined_at]
      properties:
        user_id: { $ref: "#/components/schemas/ULID" }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        joined_at: { type: string, format: date-time }
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }
    MemberRoleUpdate:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [manager, support, shipping] }
    NewInvitation:
      type: object
      required: [email, role]
      properties:
        email: { type: string, maxLength: 254 }
        role: { type: string, enum: [manager, support, shipping] }
    Invitation:
      type: object
      required: [id, email, role, created_at, expires_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        invited_by: { $ref: "#/components/schemas/ULID" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    InvitationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Invitation" }
    AcceptInvitationRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 128, description: The part after `#` in the invitation link. }
        name: { type: string, maxLength: 100, description: For a new account. }
        password: { type: string, maxLength: 128, format: password, description: For a new account. }
        client: { $ref: "#/components/schemas/ClientKind" }
    AcceptInvitationResponse:
      type: object
      required: [store_id, role, user]
      properties:
        store_id: { $ref: "#/components/schemas/ULID" }
        role: { $ref: "#/components/schemas/Role" }
        user: { $ref: "#/components/schemas/User" }
        expires_at: { type: string, format: date-time, description: Session expiry (new accounts). }
        token: { type: string, description: "Session token (new accounts, mobile clients)." }
    Me:
      type: object
      required: [user, memberships]
      properties:
        user: { $ref: "#/components/schemas/User" }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/Membership" }
    Membership:
      type: object
      required: [store_id, role]
      properties:
        store_id: { $ref: "#/components/schemas/ULID" }
        role: { $ref: "#/components/schemas/Role" }
    Role:
      type: string
      enum: [owner, manager, support, shipping]
    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SessionInfo" }
    SessionInfo:
      type: object
      required: [id, user_agent, ip_prefix, created_at, last_seen_at, expires_at, current]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        user_agent: { type: string }
        ip_prefix: { type: string, example: 203.0.113.0/24 }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean, description: This is the session making the request. }
    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        next_cursor: { type: string }
    AuditEntry:
      type: object
      required: [id, occurred_at, action, target_type, target_id, ip_prefix, metadata]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        occurred_at: { type: string, format: date-time }
        actor_user_id: { $ref: "#/components/schemas/ULID" }
        action: { type: string, example: domain.added }
        target_type: { type: string, example: domain }
        target_id: { type: string }
        ip_prefix: { type: string }
        metadata:
          type: object
          additionalProperties: true
    AdminLoginRequest:
      type: object
      required: [email, password, code]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 512, format: password }
        code: { type: string, maxLength: 12, description: Current 6-digit TOTP code. }
    AdminProfile:
      type: object
      required: [id, email, name]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        email: { type: string }
        name: { type: string }
        last_login_at: { type: string, format: date-time }
    AdminAuth:
      type: object
      required: [admin, expires_at]
      properties:
        admin: { $ref: "#/components/schemas/AdminProfile" }
        expires_at: { type: string, format: date-time }
    AdminReason:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500, description: Kept in the admin audit log. }
    AdminStoreSummary:
      type: object
      required: [store, primary_host]
      properties:
        store: { $ref: "#/components/schemas/Store" }
        primary_host: { type: string }
    AdminStorePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminStoreSummary" }
        next_cursor: { type: string }
    AdminStoreDetail:
      type: object
      required: [store, domains]
      properties:
        store: { $ref: "#/components/schemas/Store" }
        domains:
          type: array
          items: { $ref: "#/components/schemas/Domain" }
    AdminAuditEntry:
      type: object
      required: [id, occurred_at, action, target_type, target_id, ip_prefix, metadata]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        occurred_at: { type: string, format: date-time }
        admin_id: { $ref: "#/components/schemas/ULID" }
        action: { type: string, example: store.suspended }
        target_type: { type: string }
        target_id: { type: string }
        ip_prefix: { type: string }
        metadata:
          type: object
          additionalProperties: true
    AdminAuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminAuditEntry" }
        next_cursor: { type: string }
    Store:
      type: object
      required: [id, slug, name, status, plan, currency, locale, timezone, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        slug: { type: string, example: my-shop }
        name: { type: string, example: متجر أحمد }
        status: { type: string, enum: [active, suspended, closed] }
        plan: { type: string, enum: [free, basic, pro] }
        currency: { type: string, enum: [EGP, SAR, AED] }
        locale: { type: string, enum: [ar, en] }
        timezone: { type: string, example: Africa/Cairo }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StoreSettings:
      type: object
      required: [name, locale, timezone]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        locale: { type: string, enum: [ar, en] }
        timezone:
          type: string
          enum: [Africa/Cairo, Asia/Riyadh, Asia/Dubai, Asia/Kuwait, Asia/Qatar, Asia/Bahrain, Asia/Muscat, UTC]
    NewDomain:
      type: object
      required: [host]
      properties:
        host: { type: string, maxLength: 253, example: shop.example.com }
    Domain:
      type: object
      required: [id, host, kind, status, is_primary, created_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        host: { type: string, example: shop.example.com }
        kind: { type: string, enum: [subdomain, custom] }
        status: { type: string, enum: [pending, verified, failed] }
        is_primary: { type: boolean }
        failure_reason:
          type: string
          enum: [txt_record_not_found, dns_error, domain_taken, verification_timed_out]
        verification:
          $ref: "#/components/schemas/DomainVerification"
        verified_at: { type: string, format: date-time }
        last_checked_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    DomainVerification:
      type: object
      description: The TXT record to publish (custom domains that are not verified yet).
      required: [record_type, name, value]
      properties:
        record_type: { type: string, enum: [TXT] }
        name: { type: string, example: _iftah-verify.shop.example.com }
        value: { type: string, example: iftah-verify=k3j5... }
    DomainList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Domain" }
    ProductOption:
      type: object
      required: [name, values]
      properties:
        name: { type: string, minLength: 1, maxLength: 50, example: المقاس }
        values:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 50 }
          example: [S, M, L]
    ProductInput:
      type: object
      required: [title, variants]
      properties:
        title: { type: string, minLength: 1, maxLength: 200, example: تيشيرت قطن }
        slug: { type: string, maxLength: 120, description: Derived from the title when empty. }
        description: { type: string, maxLength: 20000 }
        status: { type: string, enum: [draft, active, archived], default: draft }
        options:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/ProductOption" }
        variants:
          type: array
          minItems: 1
          maxItems: 100
          description: Exactly one when there are no options.
          items: { $ref: "#/components/schemas/VariantInput" }
        category_ids:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ULID" }
    VariantInput:
      type: object
      required: [price_minor]
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        sku: { type: string, maxLength: 64 }
        option_values:
          type: array
          maxItems: 3
          description: One value per option, in option order.
          items: { type: string, maxLength: 50 }
        price_minor: { type: integer, format: int64, minimum: 0, example: 15000 }
        compare_at_minor: { type: integer, format: int64, minimum: 1, description: Must exceed price_minor. }
        tracked: { type: boolean, default: true, description: New variants only. }
        on_hand: { type: integer, minimum: 0, maximum: 1000000, default: 0, description: New variants only. }
    Product:
      type: object
      required: [id, slug, title, description, status, options, variants, category_ids, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        slug: { type: string, example: تيشيرت-قطن }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [draft, active, archived] }
        options:
          type: array
          items: { $ref: "#/components/schemas/ProductOption" }
        variants:
          type: array
          items: { $ref: "#/components/schemas/Variant" }
        category_ids:
          type: array
          items: { $ref: "#/components/schemas/ULID" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Variant:
      type: object
      required: [id, option_values, price_minor, currency, position, stock]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        sku: { type: string }
        option_values:
          type: array
          items: { type: string }
        price_minor: { type: integer, format: int64 }
        compare_at_minor: { type: integer, format: int64 }
        currency: { type: string, enum: [EGP, SAR, AED] }
        position: { type: integer }
        stock: { $ref: "#/components/schemas/Stock" }
    Stock:
      type: object
      required: [tracked, on_hand, reserved, available]
      properties:
        tracked: { type: boolean, description: Untracked stock never runs out. }
        on_hand: { type: integer }
        reserved: { type: integer, description: Held by checkouts that have not completed. }
        available: { type: integer, description: on_hand - reserved (meaningless when untracked). }
    InventoryInput:
      type: object
      required: [on_hand]
      properties:
        tracked: { type: boolean, default: true }
        on_hand: { type: integer, minimum: 0, maximum: 1000000 }
    ProductPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        next_cursor: { type: string }
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120, example: ملابس رجالي }
        slug: { type: string, maxLength: 120, description: Derived from the name when empty. }
        parent_id: { $ref: "#/components/schemas/ULID" }
        position: { type: integer, minimum: 0, maximum: 10000, default: 0 }
    Category:
      type: object
      required: [id, slug, name, position, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        parent_id: { $ref: "#/components/schemas/ULID" }
        slug: { type: string }
        name: { type: string }
        position: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Category" }
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable, draining]
        checks:
          type: object
          description: Per-dependency result, e.g. {"postgres":"ok","redis":"timeout"}.
          additionalProperties:
            type: string
    VersionInfo:
      type: object
      required: [version, commit, go_version, role]
      properties:
        version: { type: string, example: v0.1.0 }
        commit: { type: string, example: 4b40e6d }
        go_version: { type: string, example: go1.27.2 }
        role: { type: string, enum: [api, storefront, worker] }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, example: "urn:iftahonline:problem:not-found" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: Stable machine-readable error code. }
        request_id: { type: string }
        errors:
